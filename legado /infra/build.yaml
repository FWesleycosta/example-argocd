parameters:
  # ── .NET ──
  - name: dotnet_version
    type: string
    default: "10.0.x"
  - name: vsts_feed_url
    type: string
    default: "https://pkgs.dev.azure.com/bancofibra/_packaging/FibraPackages/nuget/v3/index.json"
  - name: python_version
    type: string
    default: "3.12"

steps:
  - checkout: self
    persistCredentials: true

  - script: |
      set -e
      sudo wget -qO /usr/local/bin/yq \
        https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
      sudo chmod +x /usr/local/bin/yq

      CONFIG=$(find "$(Build.SourcesDirectory)/config" -name "*.yaml" | head -1)
      if [ -z "$CONFIG" ]; then
        echo "##[error] Nenhum .yaml encontrado em config/"
        exit 1
      fi

      echo "##[section] Config encontrado: $CONFIG"
      cat "$CONFIG"

      # Extrai o runtime de defaults.runtime (ex: dotnet10, python3.12)
      RAW_RUNTIME=$(yq e '.defaults.runtime // "dotnet10"' "$CONFIG")
      SRC_PATH=$(yq e '.src_path' "$CONFIG")

      # Normaliza: "dotnet10" -> "dotnet", "python3.12" -> "python"
      if echo "$RAW_RUNTIME" | grep -qi "^python"; then
        RUNTIME="python"
        # Extrai versão: python3.12 -> 3.12
        PY_VER=$(echo "$RAW_RUNTIME" | sed -E 's/^python//')
        if [ -z "$PY_VER" ]; then
          PY_VER="${{ parameters.python_version }}"
        fi
        echo "##vso[task.setvariable variable=PYTHON_VERSION]$PY_VER"
      else
        RUNTIME="dotnet"
      fi

      echo "##[section] Runtime normalizado: $RUNTIME (raw: $RAW_RUNTIME)"
      echo "##[section] src_path: $SRC_PATH"

      echo "##vso[task.setvariable variable=LAMBDA_RUNTIME]$RUNTIME"
      echo "##vso[task.setvariable variable=LAMBDA_SRC_PATH]$SRC_PATH"
    displayName: "Detectar runtime (dotnet / python)"

  - template: build-dotnet.yml
    parameters:
      dotnet_version: ${{ parameters.dotnet_version }}
      vsts_feed_url: ${{ parameters.vsts_feed_url }}

  - template: build-python.yml
    parameters:
      python_version: ${{ parameters.python_version }}

  - publish: $(Build.ArtifactStagingDirectory)/zip
    artifact: lambda-zip
    displayName: "Publicar artefato ZIP"
