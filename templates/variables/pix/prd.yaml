# templates/variables/pix/prd.yaml
# Variáveis ESPECÍFICAS do domínio PIX — ambiente PRD. Mesmos NOMES de dev/hml.
variables:
  - name: awsRegion
    value: 'sa-east-1'
  - name: awsAccID
    value: ''
  - name: serviceAccount
    value: 'fibra-pix-prd'
  - name: serviceAccountTerraform
    value: 'fibra-pix-prd'
  - name: clusterName
    value: 'eks--prd'
  - name: albSharedDns
    value: 'internal-'
  - name: albSharedListener
    value: 'arn:aws'
  - name: apiGatewayVpcLink
    value: ''
  - name: vpcEndpointApiGateway
    value: 'vpce-'
  - name: domainInternal
    value: 'pr'
  - name: domainInternalID
    value: ''
