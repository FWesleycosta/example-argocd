# templates/variables/frontend/dev.yaml
# ----------------------------------------------------------------------------
# Variáveis do FRONTEND / SPA (Internet Banking) — ambiente DEV.
# Mesmos NOMES em dev/hml/prd; só os VALORES mudam.
#
# ⚠️  SEGURANÇA: este arquivo contém config sensível (B2C, Firebase, tokens, API
#     keys). Por decisão atual, NÃO usamos variable group / Key Vault, então os
#     valores ficam em YAML. Quando isso for revisto, mova os campos sensíveis
#     (clientId, tenantId, *ApiKey, firebase.*, objectId) para Key Vault via
#     `- group:` e rotacione os que já estiveram no git. Ver docs/MIGRACAO-GLOBAL-VARIABLES.md.
#
# Obs.: o esquema antigo (sufixos -hml/-prod) só tinha valores para HML/PROD;
# os campos sem valor para DEV ficam vazios até serem preenchidos.
# ----------------------------------------------------------------------------
variables:
  # --- domínios / URLs ---
  - name: domainPublic
    value: 'dev'
  - name: cloudFrontSPA
    value: 'arn:aws:'
  - name: viteCanaisFacadeBase
    value: 'htt'
  - name: urlBase
    value: ''
  - name: urlBaseV3
    value: ''

  # --- autenticação / B2C (sensível) ---
  - name: applicationId
    value: ''
  - name: clientId
    value: ''
  - name: b2cEnv
    value: 'development'
  - name: tenantId
    value: ''
  - name: tenantName
    value: ''
  - name: tenantUrl
    value: ''
  - name: redirectUri
    value: ''

  # --- APIs / tokens (sensível) ---
  - name: fibraApiKey
    value: ''
  - name: tokenApi
    value: ''
  - name: viteApiKey
    value: 'f'

  # --- Firebase (sensível) ---
  - name: firebase.apiKey
    value: ''
  - name: firebase.appId
    value: ''
  - name: firebase.authDomain
    value: ''
  - name: firebase.databaseURL
    value: ''
  - name: firebase.projectId
    value: ''
  - name: firebase.storageBucket
    value: ''
  - name: firebase.messagingSenderId
    value: ''
  - name: firebase.measurementId
    value: ''

  # --- terceiros / observabilidade de produto ---
  - name: hotjarId
    value: ''
  - name: zendesk.chatKey
    value: ''
  - name: objectId
    value: ''
