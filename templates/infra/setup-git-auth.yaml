parameters:
  - name: authMode
    type: string
    default: 'pat'            # comportamento atual preservado
    values:
      - 'pat'
      - 'systemToken'
  - name: orgUrl
    type: string
    default: 'https://dev.azure.com/bancofibra/'
  - name: patVariable
    type: string
    default: 'GIT_PAT'
  - name: probeRepo
    type: string
    default: 'https://dev.azure.com/bancofibra/Fibra.DevOps/_git/Fibra.DevOps.Terraform'
  - name: verifyAccess
    type: boolean
    default: true
  - name: debug
    type: boolean
    default: false            # ligue só durante a investigação

steps:
  - task: Bash@3
    displayName: 'Configurar autenticação Git (módulos Terraform)'
    inputs:
      targetType: 'inline'
      script: |
        set -euo pipefail

        # Função para mascarar o token em qualquer saída de debug
        mask() { sed "s|${TOKEN}|***TOKEN***|g"; }

        # ── Seleção do token ─────────────────────────────────────────────
        if [ "${AUTH_MODE}" = "systemToken" ]; then
          TOKEN="${SYSTEM_ACCESSTOKEN:-}"
          TOKEN_ORIGEM="System.AccessToken"
          ERRO_VAZIO="System.AccessToken indisponível. Verifique se o step tem 'env: SYSTEM_ACCESSTOKEN' e se o job permite acesso ao token."
        else
          TOKEN="${GIT_PAT:-}"
          TOKEN_ORIGEM="PAT (variável '${PAT_VARIABLE_NAME}')"
          ERRO_VAZIO="A variável '${PAT_VARIABLE_NAME}' está vazia. Confirme que o variable group com o PAT está vinculado a este pipeline."
        fi

        if [ -z "${TOKEN}" ]; then
          echo "##[error]${ERRO_VAZIO}"
          exit 1
        fi

        # Detecta macro não expandida (variable group ausente): valor literal '$(...)'
        case "${TOKEN}" in
          '$('*)
            echo "##[error]O valor do token é a macro não expandida '${TOKEN}'."
            echo "##[error]A variável '${PAT_VARIABLE_NAME}' não existe neste pipeline (variable group não vinculado?)."
            exit 1
            ;;
        esac

        echo "Autenticando via ${TOKEN_ORIGEM} (${#TOKEN} caracteres)"

        # ── Bloco de debug: contexto do job ──────────────────────────────
        if [ "${DEBUG_MODE}" = "True" ] || [ "${DEBUG_MODE}" = "true" ]; then
          echo "##[group]DEBUG: contexto do job"
          echo "Agente          : ${AGENT_NAME:-?} (${AGENT_OS:-?})"
          echo "git version     : $(git --version)"
          echo "Pipeline        : ${BUILD_DEFINITIONNAME:-?} | run ${BUILD_BUILDNUMBER:-?}"
          echo "Repo do build   : ${BUILD_REPOSITORY_NAME:-?} @ ${BUILD_SOURCEBRANCH:-?}"
          echo "Projeto         : ${SYSTEM_TEAMPROJECT:-?}"
          echo ""
          echo "→ Identidade autenticada pelo token:"
          HTTP_CODE=$(curl -s -o /tmp/conn.json -w "%{http_code}" -u ":${TOKEN}" \
            "${ORG_URL%/}/_apis/connectionData?api-version=7.1-preview" || echo "curl_fail")
          echo "  HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" = "200" ]; then
            python3 - <<'PYEOF' < /tmp/conn.json || cat /tmp/conn.json | head -c 500
        import sys, json
        d = json.load(sys.stdin)
        u = d.get("authenticatedUser", {})
        print(f"  Identidade    : {u.get('providerDisplayName', '?')}")
        print(f"  Id            : {u.get('id', '?')}")
        PYEOF
          else
            echo "  (connectionData falhou — token pode estar inválido ou sem acesso à org)"
          fi
          echo ""
          echo "→ Reescritas git configuradas:"
          git config --global --get-regexp 'url\..*\.insteadof' | mask || echo "  (nenhuma)"
          echo "##[endgroup]"
        fi

        # ── Configuração da reescrita ────────────────────────────────────
        ORG_NO_SCHEME="${ORG_URL#https://}"
        git config --global url."https://x-access-token:${TOKEN}@${ORG_NO_SCHEME}".insteadOf "${ORG_URL}"

        git config --global core.askPass ""
        git config --global credential.helper ""
        export GIT_TERMINAL_PROMPT=0

        echo "Reescrita configurada para: ${ORG_URL}"

        # ── Sonda de acesso ──────────────────────────────────────────────
        if [ "${VERIFY_ACCESS}" = "True" ] || [ "${VERIFY_ACCESS}" = "true" ]; then
          echo "Testando acesso a ${PROBE_REPO}..."

          # Traces do git apenas em modo debug (vão para stderr, capturado abaixo)
          if [ "${DEBUG_MODE}" = "True" ] || [ "${DEBUG_MODE}" = "true" ]; then
            export GIT_TRACE=1
            export GIT_CURL_VERBOSE=1
          fi

          set +e
          PROBE_OUTPUT=$(git ls-remote "${PROBE_REPO}" HEAD 2>&1)
          PROBE_STATUS=$?
          set -e
          unset GIT_TRACE GIT_CURL_VERBOSE

          if [ ${PROBE_STATUS} -eq 0 ]; then
            echo "Acesso confirmado"
            if [ "${DEBUG_MODE}" = "True" ] || [ "${DEBUG_MODE}" = "true" ]; then
              echo "##[group]DEBUG: saída completa do ls-remote"
              echo "${PROBE_OUTPUT}" | mask
              echo "##[endgroup]"
            fi
          else
            echo "##[error]git ls-remote falhou (exit ${PROBE_STATUS})."
            echo "##[group]Saída completa do git (token mascarado)"
            echo "${PROBE_OUTPUT}" | mask
            echo "##[endgroup]"

            # Classificação automática do erro
            if echo "${PROBE_OUTPUT}" | grep -q "TF401019"; then
              echo "##[error]DIAGNÓSTICO: o token NÃO tem este repositório no escopo, ou a identidade não tem Read."
              echo "##[error]Com 'Protect access to repositories in YAML pipelines' ativo, o repo PRECISA estar declarado em resources.repositories DO YAML EXECUTADO — verifique o branch/commit deste run e se há um 'checkout' que o referencie."
            elif echo "${PROBE_OUTPUT}" | grep -qiE "authentication failed|401"; then
              echo "##[error]DIAGNÓSTICO: falha de autenticação — o token está inválido, expirado ou vazio no momento do uso."
            elif echo "${PROBE_OUTPUT}" | grep -qiE "could not resolve host|connection timed out|proxy"; then
              echo "##[error]DIAGNÓSTICO: problema de rede/proxy do agente, não de permissão."
            else
              echo "##[error]DIAGNÓSTICO: erro não classificado — analise a saída acima."
            fi
            exit 1
          fi
        else
          echo "Sonda de acesso desabilitada (verifyAccess=false)."
        fi
    env:
      AUTH_MODE: ${{ parameters.authMode }}
      GIT_PAT: $(${{ parameters.patVariable }})
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      PAT_VARIABLE_NAME: ${{ parameters.patVariable }}
      ORG_URL: ${{ parameters.orgUrl }}
      PROBE_REPO: ${{ parameters.probeRepo }}
      VERIFY_ACCESS: ${{ parameters.verifyAccess }}
      DEBUG_MODE: ${{ parameters.debug }}
