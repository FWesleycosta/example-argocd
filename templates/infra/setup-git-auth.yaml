parameters:
  - name: authMode
    type: string
    default: 'pat'            # comportamento atual preservado
    values:
      - 'pat'
      - 'systemToken'
  - name: orgUrl
    type: string
    default: 'https://dev.azure.com/bancofibra/'
  - name: patVariable
    type: string
    default: 'GIT_PAT'
  - name: probeRepo
    type: string
    default: 'https://dev.azure.com/bancofibra/Fibra.DevOps/_git/Fibra.DevOps.Terraform'
  - name: verifyAccess
    type: boolean
    default: true

steps:
  - task: Bash@3
    displayName: 'Configurar autenticação Git (módulos Terraform)'
    inputs:
      targetType: 'inline'
      script: |
        set -euo pipefail

        # Seleciona o token conforme o modo
        if [ "${AUTH_MODE}" = "systemToken" ]; then
          TOKEN="${SYSTEM_ACCESSTOKEN:-}"
          TOKEN_ORIGEM="System.AccessToken"
          ERRO_VAZIO="System.AccessToken indisponível. Verifique se o step tem 'env: SYSTEM_ACCESSTOKEN' e se o job permite acesso ao token."
        else
          TOKEN="${GIT_PAT:-}"
          TOKEN_ORIGEM="PAT (variável '${PAT_VARIABLE_NAME}')"
          ERRO_VAZIO="A variável '${PAT_VARIABLE_NAME}' está vazia. Confirme que o variable group com o PAT está vinculado a este pipeline."
        fi

        if [ -z "${TOKEN}" ]; then
          echo "##[error]${ERRO_VAZIO}"
          exit 1
        fi

        echo "Autenticando via ${TOKEN_ORIGEM} (${#TOKEN} caracteres)"

        ORG_NO_SCHEME="${ORG_URL#https://}"
        git config --global url."https://x-access-token:${TOKEN}@${ORG_NO_SCHEME}".insteadOf "${ORG_URL}"

        git config --global core.askPass ""
        git config --global credential.helper ""
        export GIT_TERMINAL_PROMPT=0

        echo "Reescrita configurada para: ${ORG_URL}"

        if [ "${VERIFY_ACCESS}" = "True" ] || [ "${VERIFY_ACCESS}" = "true" ]; then
          echo "Testando acesso a ${PROBE_REPO}..."
          if git ls-remote "${PROBE_REPO}" HEAD >/dev/null 2>&1; then
            echo "Acesso confirmado"
          else
            echo "##[error]Falha no acesso a ${PROBE_REPO}."
            if [ "${AUTH_MODE}" = "systemToken" ]; then
              echo "##[error]Verifique se o Build Service deste projeto tem Read no repositório de módulos."
            else
              echo "##[error]Verifique se o PAT está válido e tem escopo de leitura em Code."
            fi
            exit 1
          fi
        else
          echo "Sonda de acesso desabilitada (verifyAccess=false)."
        fi
    env:
      AUTH_MODE: ${{ parameters.authMode }}
      GIT_PAT: $(${{ parameters.patVariable }})
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      PAT_VARIABLE_NAME: ${{ parameters.patVariable }}
      ORG_URL: ${{ parameters.orgUrl }}
      PROBE_REPO: ${{ parameters.probeRepo }}
      VERIFY_ACCESS: ${{ parameters.verifyAccess }}
