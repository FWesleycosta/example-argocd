parameters:
  environment: ''
  resourceSuffix: ''
  sistema: ''
  owner: ''
  serviceAccount: ''
  serviceAccountTerraform: ''
  awsRegion: ''
  awsAccID: ''
  accessLoggingBucket: ''
  dns_name: ''
  cloudfront: 'true'
  pruneStaleFiles: 'false'
  runtime_vars: []
  distDir: '$(Pipeline.Workspace)/frontend-dist'
  # Caminhos ancorados em Pipeline.Workspace: no job de deploy só o repo `templates` é baixado
  # (checkout único), e nesse caso o ADO aponta Build.SourcesDirectory para a pasta desse repo
  # (…/s/templates) — usar Build.SourcesDirectory aqui duplicaria o "templates".
  terraformSourceDir: '$(Pipeline.Workspace)/s/templates/manifests/terraform-frontend'
  terraformWorkDir: '$(Pipeline.Workspace)/terraform'
  runtimeConfigFile: 'env-config.js'

steps:
  - script: |
      set -euo pipefail
      TF_TEMPLATES="${{ parameters.terraformSourceDir }}"
      TERRAFORM_BASE="${{ parameters.terraformWorkDir }}"

      if [ ! -d "$TF_TEMPLATES" ]; then
        echo "##[error]Terraform templates not found: $TF_TEMPLATES"
        exit 1
      fi
      mkdir -p "$TERRAFORM_BASE"
      cp -r "$TF_TEMPLATES"/. "$TERRAFORM_BASE/"
      echo "##[section]Terraform manifests:"; ls -la "$TERRAFORM_BASE"
    displayName: 'Prepare Terraform Manifests (frontend)'

  - bash: |
      set -euo pipefail
      APP="$(Build.Repository.Name)"
      PROJECT="$(System.TeamProject)"
      SUFFIX="${{ parameters.resourceSuffix }}"
      # sandbox: o sufixo substitui o env no nome do bucket (<repo>-sdx por default; sufixo
      # customizado isola outro sandbox do mesmo app — mesma regra do namespace no EKS)
      if [ -n "$SUFFIX" ]; then BUCKET="${APP}${SUFFIX}"; else BUCKET="${APP}-${{ parameters.environment }}"; fi
      jq -n --arg app "$APP" --arg bucket "$BUCKET" --arg project "$PROJECT" \
        '{app_name: $app, bucket_name: $bucket, project_name: $project}' > _app.auto.tfvars.json
      echo "_app.auto.tfvars.json:"; cat _app.auto.tfvars.json
    workingDirectory: ${{ parameters.terraformWorkDir }}
    displayName: 'TF vars de runtime (app_name/bucket_name/project_name)'

  - template: steps/terraform-apply.yaml
    parameters:
      serviceAccount: ${{ parameters.serviceAccountTerraform }}
      awsRegion: ${{ parameters.awsRegion }}
      workingDirectory: ${{ parameters.terraformWorkDir }}
      backendBucket: 'tfstate-$(Build.Repository.Name)-${{ parameters.environment }}'
      ${{ if or(eq(parameters.resourceSuffix, ''), eq(parameters.resourceSuffix, '-sdx')) }}:
        backendKey: '$(Build.Repository.Name)/terraform.tfstate'
      ${{ else }}:
        backendKey: '$(Build.Repository.Name)${{ parameters.resourceSuffix }}/terraform.tfstate'
      tfVars:
        environment: ${{ parameters.environment }}
        aws_region: ${{ parameters.awsRegion }}
        resource_suffix: ${{ parameters.resourceSuffix }}
        sistema: ${{ parameters.sistema }}
        owner: ${{ parameters.owner }}
        dns_name: ${{ parameters.dns_name }}
        cloudfront_enabled: '${{ parameters.cloudfront }}'
        access_logging_bucket: ${{ parameters.accessLoggingBucket }}

  - task: AmazonWebServices.aws-vsts-tools.AWSShellScript.AWSShellScript@1
    displayName: 'Ler outputs do Terraform'
    inputs:
      awsCredentials: ${{ parameters.serviceAccountTerraform }}
      regionName: ${{ parameters.awsRegion }}
      scriptType: inline
      inlineScript: |
        set -euo pipefail
        cd "${{ parameters.terraformWorkDir }}"
        DIST_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo "")
        BUCKET=$(terraform output -raw bucket_name 2>/dev/null || jq -r .bucket_name _app.auto.tfvars.json)
        SITE_URL=$(terraform output -raw site_url 2>/dev/null || echo "")
        echo "bucket_name=$BUCKET  cloudfront_distribution_id=${DIST_ID:-<none>}  site_url=${SITE_URL:-<none>}"
        echo "##vso[task.setvariable variable=FRONT_BUCKET]$BUCKET"
        echo "##vso[task.setvariable variable=FRONT_DIST_ID]$DIST_ID"
        echo "##vso[task.setvariable variable=FRONT_SITE_URL]$SITE_URL"

  - bash: |
      set -euo pipefail
      DIST="${{ parameters.distDir }}"
      [ -f "$DIST/index.html" ] || { echo "##[error]index.html nao encontrado em $DIST (artefato do Build ausente?)"; exit 1; }

      VARS_JSON='${{ convertToJson(parameters.runtime_vars) }}'
      COUNT=$(echo "$VARS_JSON" | jq 'length')
      echo "##[section]runtime_vars (${{ parameters.environment }}): $COUNT"

      # window.env = { "NOME": "valor", ... };  (chaves e valores escapados como JSON — seguro para hífen/aspas/barras)
      echo "$VARS_JSON" | jq -r --arg env "${{ parameters.environment }}" \
        '(map("\(.name|tostring|tojson): \(.value|tostring|tojson)") + ["\"APP_ENVIRONMENT\": \($env|tojson)"]) | "window.env = { " + join(", ") + " };"' \
        > "$DIST/${{ parameters.runtimeConfigFile }}"

      echo "##[section]${{ parameters.runtimeConfigFile }} gerado (secret/password/token/key mascarados):"
      sed -E 's/((SECRET|PASSWORD|TOKEN|KEY)[A-Z0-9_]*: )"[^"]*"/\1"***"/Ig' "$DIST/${{ parameters.runtimeConfigFile }}"

      if ! grep -q "${{ parameters.runtimeConfigFile }}" "$DIST/index.html"; then
        echo "##[warning]index.html nao referencia '${{ parameters.runtimeConfigFile }}' — o app nao vai ler window.env. Adicione <script src=\"/${{ parameters.runtimeConfigFile }}\"></script> no index.html."
      fi
    displayName: 'Gerar runtime config (window.env) no artefato'

  - task: AmazonWebServices.aws-vsts-tools.AWSShellScript.AWSShellScript@1
    displayName: 'Publicar no S3 (aws s3 sync)'
    inputs:
      awsCredentials: ${{ parameters.serviceAccount }}
      regionName: ${{ parameters.awsRegion }}
      scriptType: inline
      inlineScript: |
        set -euo pipefail
        DIST="${{ parameters.distDir }}"
        BUCKET="$(FRONT_BUCKET)"
        PRUNE="${{ parameters.pruneStaleFiles }}"
        RUNTIME_CFG="${{ parameters.runtimeConfigFile }}"

        DELETE_FLAG=""
        if [ "$PRUNE" = "true" ]; then DELETE_FLAG="--delete"; fi

        echo "##[section]sync $DIST -> s3://$BUCKET  ${DELETE_FLAG}"
        # 1) assets com hash: cache longo e imutável
        aws s3 sync "$DIST" "s3://$BUCKET" $DELETE_FLAG \
          --exclude "index.html" --exclude "$RUNTIME_CFG" \
          --cache-control "public, max-age=31536000, immutable"
        # 2) index.html e env-config.js: nunca cachear no browser (o CloudFront é invalidado abaixo)
        aws s3 cp "$DIST/$RUNTIME_CFG" "s3://$BUCKET/$RUNTIME_CFG" \
          --cache-control "no-cache, no-store, must-revalidate" --content-type "application/javascript"
        aws s3 cp "$DIST/index.html" "s3://$BUCKET/index.html" \
          --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"
        echo "##[section]✔ publicado em s3://$BUCKET"

  - ${{ if eq(parameters.cloudfront, 'true') }}:
      - task: AmazonWebServices.aws-vsts-tools.AWSShellScript.AWSShellScript@1
        displayName: 'Invalidar cache do CloudFront (/*)'
        inputs:
          awsCredentials: ${{ parameters.serviceAccount }}
          regionName: ${{ parameters.awsRegion }}
          scriptType: inline
          inlineScript: |
            set -euo pipefail
            DIST_ID="$(FRONT_DIST_ID)"
            if [ -z "$DIST_ID" ]; then
              echo "##[error]cloudfront_distribution_id vazio — o Terraform nao expos o output (cdn.cloudfront=true)."
              exit 1
            fi
            INV_ID=$(aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" \
              --query 'Invalidation.Id' --output text)
            echo "Invalidation $INV_ID criada na distribuicao $DIST_ID. Aguardando conclusao..."
            aws cloudfront wait invalidation-completed --distribution-id "$DIST_ID" --id "$INV_ID"
            echo "##[section]✔ cache invalidado. Site: $(FRONT_SITE_URL)"
