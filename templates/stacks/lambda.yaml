# Stack de AWS Lambda (.NET, Node.js ou Python; pacote zip com N handlers). Mesmo roteamento por
# branch do backend/frontend; o motor é deploy-lambda.yaml + manifests/terraform-lambda (a infra
# que no modelo legado morava em terraform/ de cada repositório de lambda).
#
# lambda.runtime escolhe, em compile-time, o Sonar e o Build (o deploy é o mesmo para os três):
#   dotnetNN  (default dotnet10) -> sonarqube/qa-sonar-dotnet.yaml + dotnet/build-lambda-dotnet.yaml
#   nodejsNN.x                   -> sonarqube/qa-sonar-node.yaml   + node/build-lambda-node.yaml
#   pythonX.Y                    -> sonarqube/qa-sonar-python.yaml + python/build-lambda-python.yaml
# Outro prefixo (java, ruby, provided) falha no Validate: o Terraform aceita, a esteira não builda.
parameters:
  # --- função (stage Build + Terraform) ---
  # handlers (obrigatório): <chave>: handler no formato do runtime — .NET 'Assembly::Tipo::Metodo',
  # Node 'arquivo.export' (relativo à raiz do zip), Python 'modulo.funcao'.
  # src_path: .NET = csproj (obrigatório); Node = diretório do package.json; Python = diretório
  # do código/requirements ('.' = raiz, default).
  # Por runtime (opcionais): dotnet_version '10.0.x' · node_version (default derivado do runtime),
  # install_command, build_command 'npm run build --if-present', output_dir '', include_dependencies
  # true · python_version (default derivado do runtime), requirements_file 'requirements.txt',
  # lint_command ''.
  # smoke_tests (recomendado): lista de { handler, payload, environments? } invocada após cada deploy;
  # FunctionError falha o stage (steps/lambda-smoke-test.yaml). datadog_tracing: false = opt-out do
  # APM Datadog em prd (só prd é instrumentado; stages/deploy-lambda.yaml).
  # Demais chaves (default no root Terraform): function_name_prefix (vazio = nome do repositório),
  # architecture x86_64, memory_size 512, timeout 30, tracing_config PassThrough, description,
  # log_retention_days 30, layer_arns []. Chave omitida usa o default (o objeto NÃO precisa vir completo).
  - name: lambda
    type: object

  # --- recursos AWS (todas as chaves opcionais): sqs, sns_topics, sns_sqs_subscriptions,
  # secrets, sqs_triggers, step_functions, pipes — contrato em manifests/terraform-lambda/README.md
  - name: resources
    type: object
    default: {}

  # env_vars: iguais nos três ambientes; env_vars_by_env.<env>: sobrescrevem por ambiente;
  # ssm_parameters.<env>: a esteira seleciona o do ambiente do stage. Chave omitida = vazio.
  - name: config
    type: object
    default:
      env_vars: []
      env_vars_by_env:
        dev: []
        hml: []
        prd: []
      ssm_parameters:
        dev: []
        hml: []
        prd: []

  - name: veracode
    type: object
    default: {}
  - name: destroySandbox
    type: boolean
    default: false
    displayName: 'DESTRUIR o sandbox (terraform destroy: funções, filas, tópicos...) — só branches sandbox/*'
  - name: planOnly
    type: boolean
    default: false
    displayName: 'Somente terraform plan (não aplica infra nem atualiza funções)'
  - name: sistema
    type: string
    default: ''
    displayName: 'Sistema/dominio de negocio (tag de governanca AWS)'
  - name: owner
    type: string
    default: ''
    displayName: 'Time/pessoa responsavel pela aplicacao (tag de governanca AWS)'
  - name: resourceSuffix
    type: string
    default: ''
    displayName: 'Sufixo de recursos AWS (somente sandbox; vazio usa -sdx)'

variables:
  - group: git-credentials   # GIT_PAT para o terraform init clonar módulos privados (Fibra.DevOps.Terraform)

stages:
  - ${{ if eq(parameters.destroySandbox, true) }}:
      - ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/sandbox/') }}:
          - template: ../stages/destroy-sandbox-lambda.yaml
            parameters:
              lambda: ${{ parameters.lambda }}
              resources: ${{ parameters.resources }}
              ssm_parameters: ${{ parameters.config.ssm_parameters.dev }}
              sistema: ${{ parameters.sistema }}
              owner: ${{ parameters.owner }}
              resourceSuffix: ${{ parameters.resourceSuffix }}
      - ${{ else }}:
          - stage: Destroy_guard
            displayName: 'destroySandbox bloqueado — branch não é sandbox/*'
            jobs:
              - job: Guard
                displayName: 'Bloquear destroy fora de sandbox/*'
                pool:
                  vmImage: ubuntu-latest
                steps:
                  - script: |
                      echo "##[error]destroySandbox=true só é permitido em branches sandbox/* (branch atual: $(Build.SourceBranch)). Nenhum stage de deploy ou destroy foi executado."
                      exit 1
                    displayName: 'destroySandbox fora de sandbox/*'

  - ${{ else }}:
      - stage: Validate
        displayName: 'Validar parametros'
        jobs:
          - job: ValidateLambda
            displayName: 'Validar lambda/config'
            pool:
              vmImage: ubuntu-latest
            steps:
              - ${{ if not(or(startsWith(coalesce(parameters.lambda.runtime, 'dotnet10'), 'dotnet'), startsWith(coalesce(parameters.lambda.runtime, 'dotnet10'), 'nodejs'), startsWith(coalesce(parameters.lambda.runtime, 'dotnet10'), 'python'))) }}:
                  - script: |
                      echo "##[error]lambda.runtime='${{ coalesce(parameters.lambda.runtime, 'dotnet10') }}' nao e suportado pela esteira. Aceitos: dotnetNN (ex.: dotnet10), nodejsNN.x (ex.: nodejs20.x), pythonX.Y (ex.: python3.12)."
                      exit 1
                    displayName: 'lambda.runtime nao suportado'
              - ${{ elseif and(startsWith(coalesce(parameters.lambda.runtime, 'dotnet10'), 'dotnet'), eq(parameters.lambda.src_path, '')) }}:
                  - script: |
                      echo "##[error]lambda.src_path e obrigatorio para .NET (caminho do csproj, ex.: src/Minha.Lambda/Minha.Lambda.csproj)"
                      exit 1
                    displayName: 'lambda.src_path ausente'
              - ${{ else }}:
                  - script: |
                      echo "runtime: '${{ coalesce(parameters.lambda.runtime, 'dotnet10') }}'  src_path: '${{ coalesce(parameters.lambda.src_path, '.') }}'"
                    displayName: 'runtime/src_path ok'

              - ${{ if eq(parameters.lambda.handlers, '') }}:
                  - script: |
                      echo "##[error]lambda.handlers e obrigatorio: <chave>: handler (.NET 'Assembly::Tipo::Metodo' | Node 'arquivo.export' | Python 'modulo.funcao'), uma funcao por chave"
                      exit 1
                    displayName: 'lambda.handlers ausente'

              - ${{ if and(ne(parameters.lambda.architecture, ''), ne(parameters.lambda.architecture, 'x86_64'), ne(parameters.lambda.architecture, 'arm64')) }}:
                  - script: |
                      echo "##[error]lambda.architecture deve ser x86_64 ou arm64 (recebido: '${{ parameters.lambda.architecture }}')"
                      exit 1
                    displayName: 'lambda.architecture invalida'

              - ${{ if eq(parameters.sistema, '') }}:
                  - script: |
                      echo "##[warning]Parametro 'sistema' nao informado. A tag 'Sistema' dos recursos AWS ficara vazia."
                    displayName: 'Alertar sistema nao informado'
              - ${{ if eq(parameters.owner, '') }}:
                  - script: |
                      echo "##[warning]Parametro 'owner' nao informado. A tag 'Owner' dos recursos AWS ficara vazia."
                    displayName: 'Alertar owner nao informado'

      - stage: SonarQube
        displayName: 'Analisar qualidade com SonarQube'
        dependsOn: Validate
        condition: succeeded()
        jobs:
          - job: SonarQubeScan
            displayName: "Analisar código (${{ coalesce(parameters.lambda.runtime, 'dotnet10') }})"
            pool:
              vmImage: ubuntu-latest
            steps:
              - checkout: self
                fetchDepth: 0
                displayName: 'Obter código-fonte completo'
              # Sonar sempre roda na raiz do repositório (package.json / requirements na raiz);
              # lambda.src_path só afeta o Build. Gate bloqueante nos três runtimes (mesma
              # política do .NET): lint/testes com falha e Quality Gate reprovado derrubam o run.
              - ${{ if startsWith(coalesce(parameters.lambda.runtime, 'dotnet10'), 'nodejs') }}:
                  - template: ../sonarqube/qa-sonar-node.yaml
                    parameters:
                      nodeVersion: ${{ coalesce(parameters.lambda.node_version, replace(coalesce(parameters.lambda.runtime, 'dotnet10'), 'nodejs', '')) }}
                      installCommand: ${{ coalesce(parameters.lambda.install_command, '') }}
                      testCommand: 'npm test --if-present -- --coverage'
                      enforce: true
                      breakOnQualityGate: true
              - ${{ elseif startsWith(coalesce(parameters.lambda.runtime, 'dotnet10'), 'python') }}:
                  - template: ../sonarqube/qa-sonar-python.yaml
                    parameters:
                      pythonVersion: ${{ coalesce(parameters.lambda.python_version, replace(coalesce(parameters.lambda.runtime, 'dotnet10'), 'python', '')) }}
                      lintCommand: ${{ coalesce(parameters.lambda.lint_command, '') }}
                      enforce: true
                      breakOnQualityGate: true
              - ${{ else }}:
                  - template: ../sonarqube/qa-sonar-dotnet.yaml
                    parameters:
                      dotnetVersion: ${{ coalesce(parameters.lambda.dotnet_version, '10.0.x') }}

      - stage: Build
        displayName: 'Compilar e empacotar Lambda'
        dependsOn: SonarQube
        condition: succeeded()
        jobs:
          - ${{ if startsWith(coalesce(parameters.lambda.runtime, 'dotnet10'), 'nodejs') }}:
              - template: ../node/build-lambda-node.yaml
                parameters:
                  srcPath: ${{ coalesce(parameters.lambda.src_path, '.') }}
                  nodeVersion: ${{ coalesce(parameters.lambda.node_version, replace(coalesce(parameters.lambda.runtime, 'dotnet10'), 'nodejs', '')) }}
                  installCommand: ${{ coalesce(parameters.lambda.install_command, '') }}
                  buildCommand: ${{ coalesce(parameters.lambda.build_command, 'npm run build --if-present') }}
                  outputDir: ${{ coalesce(parameters.lambda.output_dir, '') }}
                  ${{ if eq(parameters.lambda.include_dependencies, false) }}:
                    includeDependencies: false
                  architecture: ${{ coalesce(parameters.lambda.architecture, 'x86_64') }}
                  handlers: ${{ parameters.lambda.handlers }}
          - ${{ elseif startsWith(coalesce(parameters.lambda.runtime, 'dotnet10'), 'python') }}:
              - template: ../python/build-lambda-python.yaml
                parameters:
                  srcPath: ${{ coalesce(parameters.lambda.src_path, '.') }}
                  pythonVersion: ${{ coalesce(parameters.lambda.python_version, replace(coalesce(parameters.lambda.runtime, 'dotnet10'), 'python', '')) }}
                  requirementsFile: ${{ coalesce(parameters.lambda.requirements_file, 'requirements.txt') }}
                  architecture: ${{ coalesce(parameters.lambda.architecture, 'x86_64') }}
                  handlers: ${{ parameters.lambda.handlers }}
          - ${{ else }}:
              - template: ../dotnet/build-lambda-dotnet.yaml
                parameters:
                  csprojPath: ${{ parameters.lambda.src_path }}
                  dotnetVersion: ${{ coalesce(parameters.lambda.dotnet_version, '10.0.x') }}
                  architecture: ${{ coalesce(parameters.lambda.architecture, 'x86_64') }}

      - ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/') }}:
          - template: ../hotfix/hotfix-lambda.yaml
            parameters:
              lambda: ${{ parameters.lambda }}
              resources: ${{ parameters.resources }}
              config: ${{ parameters.config }}
              veracode: ${{ parameters.veracode }}
              sistema: ${{ parameters.sistema }}
              owner: ${{ parameters.owner }}
              planOnly: ${{ parameters.planOnly }}
              ${{ if startsWith(coalesce(parameters.lambda.runtime, 'dotnet10'), 'nodejs') }}:
                veracodeExcludePatterns: |
                  !**/node_modules/**
                  !**/dist/**
                  !**/build/**
                  !**/coverage/**
                  !**/*.map
                  !**/.git/**
              ${{ elseif startsWith(coalesce(parameters.lambda.runtime, 'dotnet10'), 'python') }}:
                veracodeExcludePatterns: |
                  !**/.venv/**
                  !**/venv/**
                  !**/__pycache__/**
                  !**/.pytest_cache/**
                  !**/htmlcov/**
                  !**/*.egg-info/**
                  !**/.git/**

      - ${{ elseif startsWith(variables['Build.SourceBranch'], 'refs/heads/release/') }}:
          - template: ../stages/deploy-lambda.yaml
            parameters:
              environment: hml
              dependsOn: [Build]
              lambda: ${{ parameters.lambda }}
              resources: ${{ parameters.resources }}
              env_vars: ${{ parameters.config.env_vars }}
              env_vars_env: ${{ parameters.config.env_vars_by_env.hml }}
              ssm_parameters: ${{ parameters.config.ssm_parameters.hml }}
              sistema: ${{ parameters.sistema }}
              owner: ${{ parameters.owner }}
              resourceSuffix: ${{ parameters.resourceSuffix }}
              planOnly: ${{ parameters.planOnly }}

          - template: ../stages/veracode.yaml
            parameters:
              dependsOn: [Deploy_hml]
              veracode: ${{ parameters.veracode }}
              ${{ if startsWith(coalesce(parameters.lambda.runtime, 'dotnet10'), 'nodejs') }}:
                excludePatterns: |
                  !**/node_modules/**
                  !**/dist/**
                  !**/build/**
                  !**/coverage/**
                  !**/*.map
                  !**/.git/**
              ${{ elseif startsWith(coalesce(parameters.lambda.runtime, 'dotnet10'), 'python') }}:
                excludePatterns: |
                  !**/.venv/**
                  !**/venv/**
                  !**/__pycache__/**
                  !**/.pytest_cache/**
                  !**/htmlcov/**
                  !**/*.egg-info/**
                  !**/.git/**

          - template: ../stages/deploy-lambda.yaml
            parameters:
              environment: prd
              dependsOn: [Deploy_hml, Veracode]
              condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
              lambda: ${{ parameters.lambda }}
              resources: ${{ parameters.resources }}
              env_vars: ${{ parameters.config.env_vars }}
              env_vars_env: ${{ parameters.config.env_vars_by_env.prd }}
              ssm_parameters: ${{ parameters.config.ssm_parameters.prd }}
              sistema: ${{ parameters.sistema }}
              owner: ${{ parameters.owner }}
              resourceSuffix: ${{ parameters.resourceSuffix }}
              planOnly: ${{ parameters.planOnly }}

          - stage: PR_Main
            displayName: 'Abrir PR (release → main)'
            dependsOn: Deploy_prd
            condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
            jobs:
              - template: ../utils/create-pullrequest.yaml
                parameters:
                  sourceBranch: ${{ replace(variables['Build.SourceBranch'], 'refs/heads/', '') }}
                  targetBranch: main

      - ${{ elseif startsWith(variables['Build.SourceBranch'], 'refs/heads/sandbox/') }}:
          - template: ../stages/deploy-lambda.yaml
            parameters:
              environment: sdx
              dependsOn: [Build]
              lambda: ${{ parameters.lambda }}
              resources: ${{ parameters.resources }}
              env_vars: ${{ parameters.config.env_vars }}
              env_vars_env: ${{ parameters.config.env_vars_by_env.dev }}
              ssm_parameters: ${{ parameters.config.ssm_parameters.dev }}
              sistema: ${{ parameters.sistema }}
              owner: ${{ parameters.owner }}
              resourceSuffix: ${{ parameters.resourceSuffix }}
              planOnly: ${{ parameters.planOnly }}

      - ${{ else }}:
          - template: ../stages/deploy-lambda.yaml
            parameters:
              environment: dev
              dependsOn: [Build]
              condition: and(succeeded('Build'), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/sandbox')))
              lambda: ${{ parameters.lambda }}
              resources: ${{ parameters.resources }}
              env_vars: ${{ parameters.config.env_vars }}
              env_vars_env: ${{ parameters.config.env_vars_by_env.dev }}
              ssm_parameters: ${{ parameters.config.ssm_parameters.dev }}
              sistema: ${{ parameters.sistema }}
              owner: ${{ parameters.owner }}
              resourceSuffix: ${{ parameters.resourceSuffix }}
              planOnly: ${{ parameters.planOnly }}
