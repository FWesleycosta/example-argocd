parameters:
  - name: pod
    type: object
  - name: networking
    type: object
  - name: resources
    type: object
    default:
      dynamodb_tables: []
      s3_buckets: []
      sqs: []
      secrets: []
      sns_topics: []
      sns_sqs_subscriptions: []
  - name: observability
    type: object
    default:
      dd_lang: dotnet
      dd_lib_version: latest
  - name: config
    type: object
    default:
      env_vars: []
      ssm_parameters:
        dev: []
        hml: []
        prd: []
  - name: veracode
    type: object
    default: {}
  - name: rollbackImageTag
    type: string
    default: 'none'
  - name: destroySandbox
    type: boolean
    default: false
    displayName: 'DESTRUIR o sandbox (terraform destroy + namespace K8s) — só branches sandbox/*'
  - name: sistema
    type: string
    default: ''
    displayName: 'Sistema/dominio de negocio (tag de governanca AWS)'
  - name: owner
    type: string
    default: ''
    displayName: 'Time/pessoa responsavel pela aplicacao (tag de governanca AWS)'
  - name: resourceSuffix
    type: string
    default: ''
    displayName: 'Sufixo de recursos AWS (somente sandbox; vazio usa -sdx)'

variables:
  - group: git-credentials

stages:
  # destroySandbox=true: o run vira SÓ destroy — e apenas em branches sandbox/*. Em
  # qualquer outra branch o run FALHA num guard explícito (nunca cai no fluxo de deploy).
  # Tem precedência sobre rollbackImageTag.
  - ${{ if eq(parameters.destroySandbox, true) }}:
      - ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/sandbox/') }}:
          - template: ../stages/destroy-sandbox.yaml
            parameters:
              networking: ${{ parameters.networking }}
              resources: ${{ parameters.resources }}
              ssm_parameters: ${{ parameters.config.ssm_parameters.dev }}
              sistema: ${{ parameters.sistema }}
              owner: ${{ parameters.owner }}
              resourceSuffix: ${{ parameters.resourceSuffix }}
      - ${{ else }}:
          - stage: Destroy_guard
            displayName: 'destroySandbox bloqueado — branch não é sandbox/*'
            jobs:
              - job: Guard
                displayName: 'Bloquear destroy fora de sandbox/*'
                pool:
                  vmImage: ubuntu-latest
                steps:
                  - script: |
                      echo "##[error]destroySandbox=true só é permitido em branches sandbox/* (branch atual: $(Build.SourceBranch)). Nenhum stage de deploy ou destroy foi executado."
                      exit 1
                    displayName: 'destroySandbox fora de sandbox/*'

  - ${{ elseif and(ne(parameters.rollbackImageTag, ''), ne(parameters.rollbackImageTag, 'none')) }}:
      - template: ../stages/rollback.yaml
        parameters:
          environment: prd
          imageTag: ${{ parameters.rollbackImageTag }}

  - ${{ else }}:
      - stage: Validate
        displayName: 'Validar parametros'
        jobs:
          - job: ValidateNetworking
            displayName: 'Validar networking'
            pool:
              vmImage: ubuntu-latest
            steps:
              - ${{ if eq(parameters.networking.ingress_path, '/') }}:
                  - script: |
                      echo "##[error]ingress_path nao pode ser '/'. Use um path especifico, ex: /minha-api"
                      exit 1
                    displayName: 'ingress_path invalido'
              - ${{ else }}:
                  - script: |
                      echo "ingress_path valido: '${{ parameters.networking.ingress_path }}'"
                    displayName: 'ingress_path ok'

              - ${{ if eq(parameters.sistema, '') }}:
                  - script: |
                      echo "##[warning]Parametro 'sistema' nao informado. A tag 'Sistema' dos recursos AWS ficara vazia."
                    displayName: 'Alertar sistema nao informado'
              - ${{ if eq(parameters.owner, '') }}:
                  - script: |
                      echo "##[warning]Parametro 'owner' nao informado. A tag 'Owner' dos recursos AWS ficara vazia."
                    displayName: 'Alertar owner nao informado'

      - stage: SonarQube
        displayName: 'Analisar qualidade com SonarQube'
        dependsOn: Validate
        condition: succeeded()
        jobs:
          - job: SonarQubeScan
            displayName: 'Analisar código .NET'
            pool:
              vmImage: ubuntu-latest
            steps:
              - checkout: self
                fetchDepth: 0
                displayName: 'Obter código-fonte completo'
              - template: ../sonarqube/qa-sonar-dotnet.yaml

      - stage: Build
        displayName: 'Compilar e publicar imagem Docker'
        dependsOn: SonarQube
        condition: succeeded()
        jobs:
          - template: ../dotnet/build-backend-dotnet.yaml

      - ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/') }}:
          - template: ../hotfix/hotfix-backend-dotnet.yaml
            parameters:
              pod: ${{ parameters.pod }}
              networking: ${{ parameters.networking }}
              resources: ${{ parameters.resources }}
              observability: ${{ parameters.observability }}
              config: ${{ parameters.config }}
              veracode: ${{ parameters.veracode }}
              sistema: ${{ parameters.sistema }}
              owner: ${{ parameters.owner }}

      - ${{ elseif startsWith(variables['Build.SourceBranch'], 'refs/heads/release/') }}:
          - template: ../stages/deploy.yaml
            parameters:
              environment: hml
              dependsOn: [Build]
              pod: ${{ parameters.pod }}
              networking: ${{ parameters.networking }}
              resources: ${{ parameters.resources }}
              observability: ${{ parameters.observability }}
              env_vars: ${{ parameters.config.env_vars }}
              ssm_parameters: ${{ parameters.config.ssm_parameters.hml }}
              sistema: ${{ parameters.sistema }}
              owner: ${{ parameters.owner }}
              resourceSuffix: ${{ parameters.resourceSuffix }}

          - template: ../stages/veracode.yaml
            parameters:
              dependsOn: [Deploy_hml]
              veracode: ${{ parameters.veracode }}

          - template: ../stages/deploy.yaml
            parameters:
              environment: prd
              dependsOn: [Deploy_hml, Veracode]
              condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
              pod: ${{ parameters.pod }}
              networking: ${{ parameters.networking }}
              resources: ${{ parameters.resources }}
              observability: ${{ parameters.observability }}
              env_vars: ${{ parameters.config.env_vars }}
              ssm_parameters: ${{ parameters.config.ssm_parameters.prd }}
              sistema: ${{ parameters.sistema }}
              owner: ${{ parameters.owner }}
              resourceSuffix: ${{ parameters.resourceSuffix }}

          - stage: PR_Main
            displayName: 'Abrir PR (release → main)'
            dependsOn: Deploy_prd
            condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
            jobs:
              - template: ../utils/create-pullrequest.yaml
                parameters:
                  sourceBranch: ${{ replace(variables['Build.SourceBranch'], 'refs/heads/', '') }}
                  targetBranch: main

      - ${{ elseif startsWith(variables['Build.SourceBranch'], 'refs/heads/sandbox/') }}:
          - template: ../stages/deploy.yaml
            parameters:
              environment: sdx
              dependsOn: [Build]
              pod: ${{ parameters.pod }}
              networking: ${{ parameters.networking }}
              resources: ${{ parameters.resources }}
              observability: ${{ parameters.observability }}
              env_vars: ${{ parameters.config.env_vars }}
              ssm_parameters: ${{ parameters.config.ssm_parameters.dev }}
              sistema: ${{ parameters.sistema }}
              owner: ${{ parameters.owner }}
              resourceSuffix: ${{ parameters.resourceSuffix }}

      - ${{ else }}:
          - template: ../stages/deploy.yaml
            parameters:
              environment: dev
              dependsOn: [Build]
              condition: and(succeeded('Build'), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/sandbox')))
              pod: ${{ parameters.pod }}
              networking: ${{ parameters.networking }}
              resources: ${{ parameters.resources }}
              observability: ${{ parameters.observability }}
              env_vars: ${{ parameters.config.env_vars }}
              ssm_parameters: ${{ parameters.config.ssm_parameters.dev }}
              sistema: ${{ parameters.sistema }}
              owner: ${{ parameters.owner }}
              resourceSuffix: ${{ parameters.resourceSuffix }}
