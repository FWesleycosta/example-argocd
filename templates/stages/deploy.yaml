parameters:
  - name: environment
    type: string
  - name: dependsOn
    type: object
    default: [Build]
  - name: condition
    type: string
    default: succeeded()
  - name: pod
    type: object
  - name: networking
    type: object
  - name: resources
    type: object
  - name: observability
    type: object
  - name: env_vars
    type: object
    default: []
  - name: ssm_parameters
    type: object
    default: []
  - name: sistema
    type: string
    default: ''
  - name: owner
    type: string
    default: ''
  - name: resourceSuffix
    type: string
    default: ''



stages:
  - stage: Deploy_${{ parameters.environment }}
    displayName: 'Deploy ${{ parameters.environment }}'
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - deployment: deploy
        displayName: 'Deploy ${{ parameters.environment }}'
        environment: ${{ parameters.environment }}
        pool:
          vmImage: ubuntu-latest
        variables:
          - template: ../variables/env/${{ parameters.environment }}.yaml
            parameters:
              resourceSuffix: ${{ parameters.resourceSuffix }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - checkout: templates
                  persistCredentials: true
                  path: s/templates

                - template: ../infra/setup-git-auth.yaml

                - template: ../deploy-backend.yaml
                  parameters:
                    environment: ${{ parameters.environment }}
                    resourceSuffix: ${{ variables.resourceSuffix }}
                    ${{ if ne(variables.resourceSuffix, '') }}:
                      k8sNamespace: '$(Build.Repository.Name)${{ variables.resourceSuffix }}'
                    ${{ else }}:
                      k8sNamespace: '$(Build.Repository.Name)-${{ parameters.environment }}'
                    sistema: ${{ parameters.sistema }}
                    owner: ${{ parameters.owner }}
                    deployment_aspnetcore_environment: ${{ variables.deployment_aspnetcore_environment }}
                    serviceAccount: ${{ variables.serviceAccount }}
                    clusterName: ${{ variables.clusterName }}
                    awsRegion: ${{ variables.awsRegion }}
                    awsAccID: ${{ variables.awsAccID }}
                    albSharedDns: ${{ variables.albSharedDns }}
                    certificate_arn: ${{ variables.certificate_arn }}
                    apiGatewayVpcLink: ${{ variables.apiGatewayVpcLink }}
                    albSharedListener: ${{ variables.albSharedListener }}
                    vpc_endpoint_apigw: ${{ variables.vpc_endpoint_apigw }}
                    domain_internal_name: ${{ variables.domain_internal_name }}
                    domain_name_id: ${{ variables.domain_name_id }}
                    deployment_aspnetcore_urls: ${{ parameters.networking.deployment_aspnetcore_urls }}
                    domain_name: ${{ parameters.networking.domain_name }}
                    ingress_path: ${{ parameters.networking.ingress_path }}
                    base_path: ${{ parameters.networking.base_path }}
                    api_visibility: ${{ parameters.networking.api_visibility }}
                    ${{ if or(eq(parameters.networking.cognito, true), eq(parameters.networking.cognito, 'true'), eq(parameters.networking.cognito, 'True')) }}:
                      cognito: 'true'
                    ${{ else }}:
                      cognito: 'false'
                    pod_requests_cpu: ${{ parameters.pod.requests_cpu }}
                    pod_requests_memory: ${{ parameters.pod.requests_memory }}
                    pod_limits_cpu: ${{ parameters.pod.limits_cpu }}
                    pod_limits_memory: ${{ parameters.pod.limits_memory }}
                    ${{ if eq(parameters.environment, 'prd') }}:
                      pod_min_replicas: ${{ parameters.pod.min_replicas }}
                      pod_max_replicas: ${{ parameters.pod.max_replicas }}
                    ${{ else }}:
                      pod_min_replicas: '1'
                      pod_max_replicas: '1'
                    cpu_utilization: ${{ parameters.pod.cpu_utilization }}
                    ssm_parameters: ${{ parameters.ssm_parameters }}
                    env_vars: ${{ parameters.env_vars }}
                    dynamodb_tables: ${{ parameters.resources.dynamodb_tables }}
                    s3_buckets: ${{ parameters.resources.s3_buckets }}
                    secrets: ${{ parameters.resources.secrets }}
                    sqs: ${{ parameters.resources.sqs }}
                    sns_topics: ${{ parameters.resources.sns_topics }}
                    sns_sqs_subscriptions: ${{ parameters.resources.sns_sqs_subscriptions }}
                    dd_lang: ${{ parameters.observability.dd_lang }}
                    dd_lib_version: ${{ parameters.observability.dd_lib_version }}

                # Registro de release (DORA): 1) identidade do artefato (imagem ECR: digest + tag
                # móvel `prod` só em prd) → 2) registro (history.jsonl, DEPLOY-PRD.md, artefato).
                - ${{ if in(parameters.environment, 'prd', 'hml') }}:
                    - template: ../steps/resolve-artifact-image.yaml
                      parameters:
                        serviceAccount: ${{ variables.serviceAccount }}
                        awsRegion: ${{ variables.awsRegion }}
                        awsAccID: ${{ variables.awsAccID }}
                        ${{ if ne(parameters.environment, 'prd') }}:
                          prodTag: ''
                    - template: ../steps/record-prod-release.yaml
                      parameters:
                        environment: ${{ parameters.environment }}
                        ${{ if ne(parameters.environment, 'prd') }}:
                          stampRun: false
                          captureApproval: false
                          artifactName: 'hml-release'

#                - template: ../steps/rollout-verify.yaml
