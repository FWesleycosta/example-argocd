parameters:
  - name: dependsOn
    type: object
    default: [Build]
  - name: condition
    type: string
    default: succeeded()
  - name: veracode
    type: object
    default: {}
  - name: pool
    type: object
    default:
      vmImage: ubuntu-latest
  - name: timeoutInMinutes
    type: number
    default: 120
  - name: defaultExcludePatterns
    type: string
    default: ''      # usado só se o app não informar veracode.excludePatterns (ex.: stack de frontend exclui node_modules/dist)

stages:
  - stage: Veracode
    displayName: Veracode SAST
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - job: SecurityScan
        displayName: Veracode SAST
        timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
        pool: ${{ parameters.pool }}
        steps:
          - template: ../veracode/scanner-veracode.yaml
            parameters:
              excludePatterns: ${{ coalesce(parameters.veracode.excludePatterns, parameters.defaultExcludePatterns) }}
              ${{ each par in parameters.veracode }}:
                ${{ if ne(par.key, 'excludePatterns') }}:
                  ${{ par.key }}: ${{ par.value }}
