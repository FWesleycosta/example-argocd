trigger:
  batch: true
  branches:
    include:
      - develop
      - sandbox/*
      - release/*
      - hotfix/*

resources:
  repositories:
    - repository: templates
      type: git
      name: Fibra.DevOps/Fibra.DevOps.Pipelines
      ref: refs/tags/v2.3.0

extends:
  template: templates/stacks/spa-frontend.yaml@templates
  parameters:
    sistema: internet-banking
    owner: squad-canais
    # resourceSuffix: ''

    frontend:
      node_version: '20.x'
      install_command: ''
      build_command: 'npm run build'
      output_dir: 'dist'

    cdn:
      dns_name: internet-banking
      cloudfront: true
      response_headers_policy_name: fibra-security-headers   # policy compartilhada da conta (plataforma); '' = managed AWS CORS-and-SecurityHeaders
      prune_stale_files: false           # true = remove do bucket arquivos que não estão mais no dist

    config:
      env_vars:
        - name: GENERATE_SOURCEMAP
          value: 'false'
      runtime_vars:
        dev:
          - name: API_URL
            value: https://dev-api-int.bancofibra.com.br
        hml:
          - name: API_URL
            value: https://hml-api-int.bancofibra.com.br
        prd:
          - name: API_URL
            value: https://api-int.bancofibra.com.br

    # Qualidade (stage SonarQube, antes do Build). mode: warn = lint/testes/Quality Gate só
    # REPORTAM (job amarelo), pipeline segue — use para adotar sem quebrar; block = vira gate.
    # Se sobrescrever o objeto, informe TODAS as chaves. Comandos vazios = pular.
    quality:
      mode: 'warn'
      lint_command: 'npm run lint --if-present'
      test_command: 'npm test --if-present -- --coverage'
      coverage_report: 'coverage/lcov.info'

    veracode: {}
