parameters:
  - name: appName
    type: string
    default: '$(Build.Repository.Name)'
  - name: serviceConnection
    type: string
    default: 'Veracode'
  - name: version
    type: string
    default: '$(Build.Repository.Name)-$(Build.SourceBranchName)-$(Build.BuildId)'
  - name: sandboxName
    type: string
    default: '$(Build.SourceBranchName)'
  - name: criticality
    type: string
    default: 'High'
  - name: createSandbox
    type: string
    default: 'true'
  - name: deleteIncompleteScan
    type: string
    default: '1'
  - name: createProfile
    type: boolean
    default: true
  - name: importResults
    type: boolean
    default: true
  - name: failBuildIfUploadAndScanFails
    type: boolean
    default: true
  - name: failBuildOnPolicyFail
    type: boolean
    default: true
  - name: maximumWaitTime
    type: string
    default: '110'
  - name: fetchDepth
    type: number
    default: 1
  - name: sourceFolder
    type: string
    default: '$(Build.SourcesDirectory)'
  - name: excludePatterns
    type: string
    default: ''
  - name: archiveFile
    type: string
    default: '$(Build.ArtifactStagingDirectory)/veracode-upload.zip'

steps:
  - checkout: self
    fetchDepth: ${{ parameters.fetchDepth }}

  - ${{ if ne(parameters.excludePatterns, '') }}:
      - task: CopyFiles@2
        displayName: 'Selecionar arquivos para o scan'
        inputs:
          SourceFolder: '${{ parameters.sourceFolder }}'
          Contents: |
            **
            ${{ parameters.excludePatterns }}
          TargetFolder: '$(Agent.TempDirectory)/veracode-src'
      - script: echo "##vso[task.setvariable variable=VeracodeSrcRoot]$(Agent.TempDirectory)/veracode-src"
        displayName: 'Definir raiz do pacote (filtrada)'

  - ${{ else }}:
      - script: echo "##vso[task.setvariable variable=VeracodeSrcRoot]${{ parameters.sourceFolder }}"
        displayName: 'Definir raiz do pacote'

  - task: ArchiveFiles@2
    displayName: 'Empacotar código para Veracode'
    inputs:
      rootFolderOrFile: '$(VeracodeSrcRoot)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '${{ parameters.archiveFile }}'
      replaceExistingArchive: true

  - task: Veracode@3
    displayName: 'Executar scan SAST (${{ parameters.appName }})'
    inputs:
      ConnectionDetailsSelection: 'Service Connection'
      AnalysisService: '${{ parameters.serviceConnection }}'
      veracodeAppProfile: '${{ parameters.appName }}'
      version: '${{ parameters.version }}'
      filepath: '${{ parameters.archiveFile }}'
      optargs: '-criticality ${{ parameters.criticality }} -createsandbox ${{ parameters.createSandbox }} -sandboxname ${{ parameters.sandboxName }} -deleteIncompleteScan ${{ parameters.deleteIncompleteScan }}'
      createSandBox: false
      createProfile: ${{ parameters.createProfile }}
      failBuildIfUploadAndScanBuildStepFails: ${{ parameters.failBuildIfUploadAndScanFails }}
      importResults: ${{ parameters.importResults }}
      failBuildOnPolicyFail: ${{ parameters.failBuildOnPolicyFail }}
      maximumWaitTime: '${{ parameters.maximumWaitTime }}'
