parameters:
  - name: serviceAccount
    type: string
  - name: awsRegion
    type: string
  - name: awsAccID
    type: string
  - name: environment
    type: string
    default: 'prd'
  - name: historyFile
    type: string
    default: '.deploy/history.jsonl'
  - name: updateMarkdown
    type: boolean
    default: true
  - name: captureApproval
    type: boolean
    default: true
  - name: imageName
    type: string
    default: '$(Build.Repository.Name)'
  - name: imageTag
    type: string
    default: '$(Build.BuildId)'
  - name: prodTag
    type: string
    default: 'prod'
  - name: deployType
    type: string
    default: 'auto'
    values: [auto, deploy, hotfix, rollback]
  - name: artifactName
    type: string
    default: 'prod-release'
  - name: stampRun
    type: boolean
    default: true
  - name: updateReleaseLog
    type: boolean
    default: true
  - name: recordBranch
    type: string
    default: ''

steps:
  - ${{ if parameters.stampRun }}:
      - bash: |
          set -euo pipefail

          echo "##vso[build.addbuildtag]prod"
          echo "##vso[build.addbuildtag]${{ parameters.imageName }}"

          BN="$(Build.BuildNumber)"
          case "$BN" in
            *"· prd") echo "Build Number já carimbado ('$BN')." ;;
            *) echo "##vso[build.updatebuildnumber]${BN} · prd" ;;
          esac
        displayName: 'Carimbar execução (deploy em prod)'

  - task: AmazonWebServices.aws-vsts-tools.AWSShellScript.AWSShellScript@1
    displayName: 'Registrar release (${{ parameters.environment }})'
    continueOnError: true
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      UPDATE_RELEASE_LOG: ${{ parameters.updateReleaseLog }}
      RECORD_BRANCH: ${{ parameters.recordBranch }}
      UPDATE_MARKDOWN: ${{ parameters.updateMarkdown }}
      CAPTURE_APPROVAL: ${{ parameters.captureApproval }}
      HISTORY_FILE: ${{ parameters.historyFile }}
    inputs:
      awsCredentials: ${{ parameters.serviceAccount }}
      regionName: ${{ parameters.awsRegion }}
      scriptType: inline
      inlineScript: |
        set -euo pipefail

        warn() { echo "##[warning]$*"; }

        ACCOUNT_ID="${{ parameters.awsAccID }}"
        REGION="${{ parameters.awsRegion }}"
        REPO="${{ parameters.imageName }}"
        TAG="${{ parameters.imageTag }}"
        PROD_TAG="${{ parameters.prodTag }}"
        ENVIRONMENT="${{ parameters.environment }}"
        # ADO emite booleanos de parâmetro como True/False — normalizar.
        UPDATE_MARKDOWN="$(printf '%s' "${UPDATE_MARKDOWN:-true}" | tr '[:upper:]' '[:lower:]')"
        CAPTURE_APPROVAL="$(printf '%s' "${CAPTURE_APPROVAL:-true}" | tr '[:upper:]' '[:lower:]')"
        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
        IMAGE_URI="${REGISTRY}/${REPO}:${TAG}"

        DEPLOY_TYPE="${{ parameters.deployType }}"
        if [ "$DEPLOY_TYPE" = "auto" ]; then
          case "$(Build.SourceBranch)" in
            refs/heads/hotfix/*) DEPLOY_TYPE="hotfix" ;;
            *)                   DEPLOY_TYPE="deploy" ;;
          esac
        fi
        case "$DEPLOY_TYPE" in
          rollback) TYPE_LABEL="rollback" ;;
          hotfix)   TYPE_LABEL="hotfix" ;;
          *)        TYPE_LABEL="deploy" ;;
        esac

        COMMIT="$(Build.SourceVersion)"
        COMMIT_MSG="${BUILD_SOURCEVERSIONMESSAGE:-}"
        if [ "$DEPLOY_TYPE" = "rollback" ]; then
          COMMIT=""
          COMMIT_MSG="Rollback para a imagem ${TAG}"
        fi
        # Versão segura p/ células de tabela markdown (sem '|' nem quebras de linha).
        MSG_SAFE="$(printf '%s' "$COMMIT_MSG" | tr '\n\r|' '  /' | cut -c1-80)"

        # 1) Digest imutável da imagem que acabou de ser promovida para prod.
        #    A tag é mutável; o digest (sha256) é a identidade real da imagem.
        resolve_digest() {
          aws ecr describe-images \
            --repository-name "$REPO" \
            --image-ids imageTag="$TAG" \
            --region "$REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/tmp/ecr_digest.err
        }

        DIGEST=""
        if DIGEST_OUT="$(resolve_digest)" && [ -n "$DIGEST_OUT" ] && [ "$DIGEST_OUT" != "None" ]; then
          DIGEST="$DIGEST_OUT"
        else
          warn "Não resolvi o digest de ${REPO}:${TAG}. O registro segue SEM digest. Confira 'ecr:DescribeImages' na service connection e se a imagem ainda existe no ECR (lifecycle policy)."
          if [ -s /tmp/ecr_digest.err ]; then
            echo "  Erro retornado pelo ECR:"
            head -c 500 /tmp/ecr_digest.err
            echo
          fi
        fi

        echo "##[section]Imagem em prod"
        echo "  URI (tag):    $IMAGE_URI"
        echo "  Digest:       ${DIGEST:-<não resolvido>}"

        # Sem digest não existe referência por digest — vazio é mais honesto que
        # "registry/repo@", que parece válido e não é.
        IMAGE_REF_BY_DIGEST=""
        if [ -n "$DIGEST" ]; then
          IMAGE_REF_BY_DIGEST="${REGISTRY}/${REPO}@${DIGEST}"
        fi

        # Tag móvel: reaponta '$PROD_TAG' para o manifesto recém-promovido.
        #   rc 1|2 -> não consegui LER o manifesto (permissão / imagem ausente).
        #   rc 3   -> put-image recusou: ou a tag já está correta, ou faltou permissão.
        promote_moving_tag() {
          local manifest
          manifest="$(aws ecr batch-get-image \
            --repository-name "$REPO" \
            --image-ids imageTag="$TAG" \
            --region "$REGION" \
            --query 'images[0].imageManifest' \
            --output text 2>/dev/null)" || return 1
          [ -n "$manifest" ] && [ "$manifest" != "None" ] || return 2
          aws ecr put-image \
            --repository-name "$REPO" \
            --image-tag "$PROD_TAG" \
            --image-manifest "$manifest" \
            --region "$REGION" >/dev/null 2>/tmp/ecr_puttag.err || return 3
        }

        if [ -z "$PROD_TAG" ]; then
          echo "  Tag móvel desabilitada (prodTag vazio — perfil ${ENVIRONMENT})."
          MOVING_RC=-1
        else
        set +e; promote_moving_tag; MOVING_RC=$?; set -e
        case "$MOVING_RC" in
          0)
            echo "  Tag móvel '$PROD_TAG' atualizada para o digest atual."
            ;;
          1|2)
            warn "Não consegui ler o manifesto de ${REPO}:${TAG} — a tag móvel '$PROD_TAG' NÃO foi atualizada e pode estar apontando para uma versão anterior. Confira 'ecr:BatchGetImage' na service connection."
            ;;
          *)
            if grep -q "ImageAlreadyExistsException" /tmp/ecr_puttag.err 2>/dev/null; then
              echo "  Tag '$PROD_TAG' já aponta para este digest (nada a fazer)."
            else
              warn "Não consegui mover a tag '$PROD_TAG' para ${REPO}:${TAG} — ela pode estar apontando para uma versão anterior. Confira 'ecr:PutImage' na service connection."
              if [ -s /tmp/ecr_puttag.err ]; then
                echo "  Erro retornado pelo ECR:"
                head -c 500 /tmp/ecr_puttag.err
                echo
              fi
            fi
            ;;
        esac
        fi

        PIPELINE_URL="$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"

        OUT_DIR="$(Build.ArtifactStagingDirectory)/${{ parameters.artifactName }}"
        mkdir -p "$OUT_DIR"

        DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

        jq -n \
          --arg app "$REPO" \
          --arg environment "$ENVIRONMENT" \
          --arg deploy_type "$DEPLOY_TYPE" \
          --arg pipeline_url "$PIPELINE_URL" \
          --arg build_id "$(Build.BuildId)" \
          --arg build_number "$(Build.BuildNumber)" \
          --arg image_uri "$IMAGE_URI" \
          --arg image_tag "$TAG" \
          --arg image_digest "$DIGEST" \
          --arg image_ref_by_digest "$IMAGE_REF_BY_DIGEST" \
          --arg prod_tag "$PROD_TAG" \
          --arg commit "$COMMIT" \
          --arg commit_message "$COMMIT_MSG" \
          --arg branch "$(Build.SourceBranch)" \
          --arg triggered_by "$(Build.RequestedFor)" \
          --arg deployed_at "$DEPLOYED_AT" \
          '{
            app: $app,
            environment: $environment,
            deploy_type: $deploy_type,
            rollback: ($deploy_type == "rollback"),
            pipeline_url: $pipeline_url,
            build_id: $build_id,
            build_number: $build_number,
            image_uri: $image_uri,
            image_tag: $image_tag,
            image_digest: $image_digest,
            image_ref_by_digest: $image_ref_by_digest,
            prod_tag: $prod_tag,
            commit: $commit,
            commit_message: $commit_message,
            branch: $branch,
            triggered_by: $triggered_by,
            deployed_at: $deployed_at
          }' > "$OUT_DIR/latest.json"

        {
          echo "=== ÚLTIMO DEPLOY EM PRODUÇÃO ==="
          echo "Aplicação:      $REPO"
          echo "Tipo:           $TYPE_LABEL"
          echo "Data (UTC):     $DEPLOYED_AT"
          echo "Disparado por:  $(Build.RequestedFor)"
          echo ""
          echo "Pipeline:       $PIPELINE_URL"
          echo "Build ID:       $(Build.BuildId)"
          echo "Build Number:   $(Build.BuildNumber)"
          echo ""
          echo "Imagem (tag):   $IMAGE_URI"
          echo "Digest:         $DIGEST"
          echo "Imagem (ref):   $IMAGE_REF_BY_DIGEST"
          echo "Tag móvel:      $PROD_TAG"
          echo ""
          echo "Commit:         ${COMMIT:--}"
          echo "Mensagem:       ${COMMIT_MSG:--}"
          echo "Branch:         $(Build.SourceBranch)"
        } > "$OUT_DIR/latest.txt"

        {
          echo "## Release em produção — $REPO"
          echo ""
          echo "| Campo | Valor |"
          echo "|-------|-------|"
          echo "| Ambiente | $ENVIRONMENT |"
          echo "| Tipo | $TYPE_LABEL |"
          echo "| Data (UTC) | $DEPLOYED_AT |"
          echo "| Disparado por | $(Build.RequestedFor) |"
          echo "| Pipeline | [Build $(Build.BuildId)]($PIPELINE_URL) |"
          echo "| Imagem (tag) | \`$IMAGE_URI\` |"
          echo "| Digest | \`$DIGEST\` |"
          echo "| Tag móvel | \`$PROD_TAG\` |"
          echo "| Commit | \`${COMMIT:--}\` |"
          echo "| Mensagem | $MSG_SAFE |"
          echo "| Branch | \`$(Build.SourceBranch)\` |"
        } > "$OUT_DIR/latest.md"

        echo "##vso[task.uploadsummary]$OUT_DIR/latest.md"

        echo "##[section]Registro gerado"
        cat "$OUT_DIR/latest.txt"

        # ---------- Entrada do histórico DORA (schema_version 1) ----------
        # Tudo best-effort: campo que não resolver vira null, nunca aborta.

        # committed_at: sem a data do commit não há lead time (deployed_at −
        # committed_at). Vem da REST de Git do ADO; rollback não tem commit.
        COMMITTED_AT=""
        resolve_committed_at() {
          [ -n "$COMMIT" ] || return 0
          [ -n "${SYSTEM_ACCESSTOKEN:-}" ] || { warn "committed_at: SYSTEM_ACCESSTOKEN vazio — lead time ficará null."; return 0; }
          COMMITTED_AT=$(curl -sS -f -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
            "$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.ID)/commits/${COMMIT}?api-version=7.1" 2>/dev/null \
            | jq -r '.committer.date // empty' 2>/dev/null) || COMMITTED_AT=""
          [ -n "$COMMITTED_AT" ] || warn "committed_at não resolvido para ${COMMIT} — lead time ficará null nesta entrada."
        }
        resolve_committed_at || COMMITTED_AT=""

        # Aprovador do gate: timeline do build -> record Checkpoint.Approval ->
        # API de approvals. NÃO validado em run real ainda — por isso cada passo
        # cai para approval: null com warning, sem afetar o deploy.
        APPROVAL_JSON="null"
        capture_approval() {
          [ "$CAPTURE_APPROVAL" = "true" ] || return 0
          [ -n "${SYSTEM_ACCESSTOKEN:-}" ] || return 0
          local tl rec appr_id gate_start appr approved_by approved_at ws t1 t2
          tl=$(curl -sS -f -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
            "$(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/timeline?api-version=7.1" 2>/dev/null) \
            || { warn "approval: timeline do build indisponível — approval: null."; return 0; }
          rec=$(echo "$tl" | jq -c '[.records[]? | select(.type=="Checkpoint.Approval")][0] // empty' 2>/dev/null)
          [ -n "$rec" ] || { echo "approval: nenhum checkpoint de aprovação neste run (CI/hotfix) — approval: null."; return 0; }
          appr_id=$(echo "$rec" | jq -r '.id // empty')
          gate_start=$(echo "$rec" | jq -r '.startTime // empty')
          [ -n "$appr_id" ] || return 0
          appr=$(curl -sS -f -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
            "$(System.CollectionUri)$(System.TeamProject)/_apis/pipelines/approvals/${appr_id}?api-version=7.1-preview.1" 2>/dev/null) \
            || { warn "approval: API de approvals falhou para ${appr_id} — approval: null."; return 0; }
          approved_by=$(echo "$appr" | jq -r '[.steps[]? | select(.status=="approved")][-1].actualApprover.displayName // empty' 2>/dev/null) || approved_by=""
          approved_at=$(echo "$appr" | jq -r '[.steps[]? | select(.status=="approved")][-1].lastModifiedOn // empty' 2>/dev/null) || approved_at=""
          ws="null"
          if [ -n "$approved_at" ] && [ -n "$gate_start" ]; then
            t1=$(date -d "$gate_start" +%s 2>/dev/null || echo "")
            t2=$(date -d "$approved_at" +%s 2>/dev/null || echo "")
            if [ -n "$t1" ] && [ -n "$t2" ] && [ "$t2" -ge "$t1" ]; then ws=$((t2 - t1)); fi
          fi
          APPROVAL_JSON=$(jq -nc --arg by "$approved_by" --arg at "$approved_at" --argjson ws "$ws" \
            '{approved_by: (if $by == "" then null else $by end),
              approved_at: (if $at == "" then null else $at end),
              wait_seconds: $ws}' 2>/dev/null) || APPROVAL_JSON="null"
          [ -n "$APPROVAL_JSON" ] || APPROVAL_JSON="null"
        }
        capture_approval || APPROVAL_JSON="null"

        HISTORY_ENTRY=$(jq -nc \
          --arg app "$REPO" \
          --arg environment "$ENVIRONMENT" \
          --arg deploy_type "$DEPLOY_TYPE" \
          --arg deployed_at "$DEPLOYED_AT" \
          --arg tag "$TAG" --arg digest "$DIGEST" --arg uri "$IMAGE_URI" --arg moving_tag "$PROD_TAG" \
          --arg commit "$COMMIT" --arg commit_message "$COMMIT_MSG" --arg committed_at "$COMMITTED_AT" \
          --arg branch "$(Build.SourceBranch)" \
          --arg build_id "$(Build.BuildId)" --arg build_number "$(Build.BuildNumber)" \
          --arg url "$PIPELINE_URL" --arg triggered_by "$(Build.RequestedFor)" \
          --argjson approval "$APPROVAL_JSON" \
          '{schema_version: 1, app: $app, environment: $environment,
            deploy_type: $deploy_type, deployed_at: $deployed_at, result: "succeeded",
            image: {tag: $tag,
                    digest: (if $digest == "" then null else $digest end),
                    uri: $uri,
                    moving_tag: (if $moving_tag == "" then null else $moving_tag end)},
            source: {commit: (if $commit == "" then null else $commit end),
                     commit_message: $commit_message,
                     committed_at: (if $committed_at == "" then null else $committed_at end),
                     branch: $branch},
            pipeline: {build_id: $build_id, build_number: $build_number,
                       url: $url, triggered_by: $triggered_by},
            approval: $approval}')
        printf '%s\n' "$HISTORY_ENTRY" > "$OUT_DIR/history-entry.json"
        echo "##[section]Entrada do histórico (${ENVIRONMENT}):"
        echo "$HISTORY_ENTRY" | jq .

        # Registro em GIT no PRÓPRIO repo da aplicação — UM arquivo:
        # DEPLOY-PRD.md (raiz) -> "Último deploy" (sobrescrito a cada deploy)
        #                          + "Histórico" (linhas anteriores preservadas).
        # O commit entra na branch deployada com [skip ci] e se propaga à main
        # pelo PR release->main que a esteira já abre. Se a branch tiver policy
        # (ex.: rollback rodado na main), cai pra branch de registro + PR.
        # Best-effort: qualquer falha vira warning e NÃO derruba o deploy.
        update_release_log() {
          local ENABLED
          ENABLED="$(printf '%s' "${UPDATE_RELEASE_LOG:-true}" | tr '[:upper:]' '[:lower:]')"
          [ "$ENABLED" = "true" ] || { echo "Registro em git desabilitado (updateReleaseLog=false)."; return 0; }

          if [ -z "${SYSTEM_ACCESSTOKEN:-}" ]; then
            echo "##[warning]SYSTEM_ACCESSTOKEN vazio — pulei o registro em git. Habilite 'Allow scripts to access the OAuth token' / mapeie System.AccessToken."
            return 0
          fi

          local BRANCH REPO_URL AUTH_CFG
          BRANCH="${RECORD_BRANCH:-}"
          if [ -z "$BRANCH" ]; then
            BRANCH="$(Build.SourceBranch)"
            BRANCH="${BRANCH#refs/heads/}"
          fi
          REPO_URL="$(Build.Repository.Uri)"
          AUTH_CFG="http.extraHeader=Authorization: Bearer ${SYSTEM_ACCESSTOKEN}"

          # clone -> escreve -> push, com retry (corrida entre runs E com pushes
          # de devs na branch — cada tentativa re-clona) e fallback de PR na
          # última tentativa (branch protegida por policy).
          local ATTEMPT WORK MD HIST LEGACY_ROWS FALLBACK PR_RESP PR_ID
          for ATTEMPT in 1 2 3; do
            WORK="$(mktemp -d)"
            if ! git -c "$AUTH_CFG" clone --quiet --depth 1 --branch "$BRANCH" "$REPO_URL" "$WORK" 2>/dev/null; then
              echo "##[warning]Não consegui clonar ${REPO_URL} (branch ${BRANCH}). Build Service tem Contribute no repo?"
              rm -rf "$WORK"; return 0
            fi

            # 1) history.jsonl — fonte de verdade, append-only (1 objeto/linha).
            HIST="$WORK/${HISTORY_FILE}"
            mkdir -p "$(dirname "$HIST")"
            printf '%s\n' "$HISTORY_ENTRY" >> "$HIST"
            git -C "$WORK" add "${HISTORY_FILE}"

            # 2) DEPLOY-PRD.md — RENDERIZADO do JSONL (só entradas de prd).
            #    Migração única: a tabela do formato antigo (pré-JSONL) é movida
            #    para a seção "Histórico anterior" e preservada dali em diante.
            if [ "${UPDATE_MARKDOWN}" = "true" ]; then
              MD="$WORK/DEPLOY-PRD.md"
              LEGACY_ROWS=""
              if [ -f "$MD" ]; then
                if grep -q "pré-JSONL" "$MD"; then
                  LEGACY_ROWS="$(awk '/pré-JSONL/{h=1; next} h && /^\| [0-9]/{print}' "$MD")"
                else
                  LEGACY_ROWS="$(awk '/^## Histórico/{h=1; next} h && /^\| [0-9]/{print}' "$MD")"
                fi
              fi
              {
                echo "# Produção — ${REPO}"
                echo ""
                echo "> Gerado pela esteira (\`record-prod-release\`) a partir de \`${HISTORY_FILE}\`. Não edite manualmente."
                echo ""
                echo "## Último deploy"
                echo ""
                echo "| Campo | Valor |"
                echo "|---|---|"
                echo "| Situação | $TYPE_LABEL |"
                echo "| Data (UTC) | $DEPLOYED_AT |"
                echo "| Imagem (tag ECR) | \`$TAG\` |"
                echo "| Digest | \`${DIGEST:--}\` |"
                echo "| Commit | \`${COMMIT:--}\` |"
                echo "| Mensagem | ${MSG_SAFE:--} |"
                echo "| Branch | \`$(Build.SourceBranch)\` |"
                echo "| Pipeline | [#$(Build.BuildId)]($PIPELINE_URL) |"
                echo "| Por | $(Build.RequestedFor) |"
                echo ""
                echo "## Histórico"
                echo ""
                echo "| Data (UTC) | Tipo | Tag | Commit | Mensagem | Build | Por |"
                echo "|---|---|---|---|---|---|---|"
                awk '{a[NR]=$0} END{for(i=NR;i>=1;i--) print a[i]}' "$HIST" 2>/dev/null | jq -r 'select(.environment == "prd")
                  | "| \(.deployed_at) | \(.deploy_type) | `\(.image.tag)` | `\((.source.commit // "-")[0:8])` | \((.source.commit_message // "-") | gsub("[|\r\n]"; " ") | .[0:80]) | [#\(.pipeline.build_id)](\(.pipeline.url)) | \(.pipeline.triggered_by) |"' 2>/dev/null | head -50
                if [ -n "$LEGACY_ROWS" ]; then
                  echo ""
                  echo "## Histórico anterior (pré-JSONL)"
                  echo ""
                  echo "| Data (UTC) | Tipo | Tag | Commit | Mensagem | Build | Por |"
                  echo "|---|---|---|---|---|---|---|"
                  printf '%s\n' "$LEGACY_ROWS" | head -50
                fi
              } > "$MD.new"
              mv "$MD.new" "$MD"
              git -C "$WORK" add DEPLOY-PRD.md
            fi

            git -C "$WORK" config user.name "Azure Pipelines ($(Build.RequestedFor))"
            git -C "$WORK" config user.email "azure-pipelines@$(System.TeamProject).invalid"
            # [skip ci] é essencial: release/* e hotfix/* estão no trigger de CI —
            # sem ele o push do registro redispararia a esteira em loop.
            git -C "$WORK" commit --quiet -m "chore(release): ${DEPLOY_TYPE} ${TAG} em ${ENVIRONMENT} [skip ci]" \
              -m "build: $(Build.BuildId) | por: $(Build.RequestedFor) | digest: ${DIGEST:--}"

            if git -C "$WORK" -c "$AUTH_CFG" push --quiet origin "HEAD:${BRANCH}" 2>/dev/null; then
              echo "##[section]DEPLOY-PRD.md atualizado na branch ${BRANCH}."
              rm -rf "$WORK"; return 0
            fi

            if [ "$ATTEMPT" -lt 3 ]; then
              echo "Push em '${BRANCH}' rejeitado (corrida ou policy). Tentativa ${ATTEMPT}/3..."
              rm -rf "$WORK"; sleep $((ATTEMPT * 2)); continue
            fi

            # Última tentativa falhou: provável branch policy (push direto proibido,
            # ex.: main). Publica o registro numa branch própria e abre PR.
            FALLBACK="release-record/$(Build.BuildId)"
            if git -C "$WORK" -c "$AUTH_CFG" push --quiet origin "HEAD:refs/heads/${FALLBACK}" 2>/dev/null; then
              PR_RESP=$(curl -sS -X POST \
                -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"sourceRefName\":\"refs/heads/${FALLBACK}\",\"targetRefName\":\"refs/heads/${BRANCH}\",\"title\":\"chore(release): registro de ${DEPLOY_TYPE} ${TAG} em prd\",\"description\":\"Registro automático do deploy em produção gerado pela esteira (record-prod-release). Build $(Build.BuildId).\"}" \
                "$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.ID)/pullrequests?api-version=7.1" || true)
              PR_ID=$(echo "$PR_RESP" | jq -r '.pullRequestId // empty' 2>/dev/null)
              if [ -n "$PR_ID" ]; then
                echo "##[warning]Push direto em '${BRANCH}' bloqueado (branch policy). Registro aberto como PR #${PR_ID} — conclua o PR para publicar o DEPLOY-PRD.md."
              else
                echo "##[warning]Registro publicado na branch '${FALLBACK}', mas a criação do PR falhou. Abra o PR manualmente para '${BRANCH}'."
              fi
            else
              echo "##[warning]Não consegui registrar o histórico em git (push rejeitado em '${BRANCH}' e no fallback '${FALLBACK}')."
            fi
            rm -rf "$WORK"
          done
          return 0
        }
        update_release_log || echo "##[warning]Não foi possível registrar o histórico em git (deploy não afetado)."

  - task: PublishPipelineArtifact@1
    displayName: 'Publicar registro de release em prod'
    continueOnError: true
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.artifactName }}'
      artifact: '${{ parameters.artifactName }}-$(System.StageAttempt)-$(System.JobAttempt)'
