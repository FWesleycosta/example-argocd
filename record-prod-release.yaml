AWSTemplateFormatVersion: '2010-09-09'
Description: Deploy de API
Parameters:
  FibraVpc:
    Type: AWS::EC2::VPC::Id
    Description: VPC do ambiente
    Default: "@@vpcID@@"
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Lista das subnets que a api (container) deve rodar
    Default: "@@subnetsID@@"
  ECRAPIRepositoryName:
    Type: String
    Description: Nome do repositorio da imagem do container.
    Default: ecr-si-matrizacessos-api
  ECRAPIImageVersion:
    Type: String
    Description: Versao da imagem.
    Default: latest
  APIName:
    Type: String
    Description: Nome da API no API Gateway
    Default: si-matrizacessos-api
  APIBasePath:
    Type: String
    Description: 'Dominio/BasePath (DDD) da API. O /<nome> depois da url da API. Ex.:
      credito em  api.bancofibra.com.br/credito'
    Default: si-matrizacessos
  APIPort:
    Type: Number
    Description: Porta da API no load balancer
    Default: '5029'
  DeployDate:
    Type: String
    Description: Data do Deploy. Importante para forcar o deploy do API GAteway
    Default: '2020-10-28'
  Environment:
    Type: String
    Description: Ambiente da publicacao da versao.
    Default: hml
    AllowedValues:
    - dev
    - hml
    - prod
  DllName:
    Type: String
    Description: Dll gerada no dockerfile.
    Default: ControleAcesso.IBPJ.Api.dll
  DatadogEnabled:
    Type: String
    Description: 'Habilita a instrumentacao Datadog (true/false). Default: true'
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
  DatadogApiKeySecretName:
    Type: String
    Description: Nome do secret no Secrets Manager com a API key do Datadog (plaintext).
      Deve existir na mesma conta/regiao do deploy.
    Default: "@@DatadogApiKeySecretArn@@"
  DatadogSite:
    Type: String
    Description: Site do Datadog
    Default: datadoghq.com
  DatadogAgentImage:
    Type: String
    Description: Imagem do Datadog Agent (sidecar)
    Default: public.ecr.aws/datadog/agent:7
  DatadogTracerInitImage:
    Type: String
    Description: Imagem do init container com o tracer .NET (dd-lib-dotnet-init)
    Default: datadog/dd-lib-dotnet-init:v3
  DatadogFluentBitImage:
    Type: String
    Description: Imagem do Fluent Bit (FireLens) para roteamento de logs
    Default: public.ecr.aws/aws-observability/aws-for-fluent-bit:stable
Conditions:
  IsProd:
    Fn::Equals:
    - Ref: Environment
    - prod
  NotLab:
    Fn::Not:
    - Fn::Equals:
      - Ref: Environment
      - lab
  EnableDatadog:
    Fn::Equals:
    - Ref: DatadogEnabled
    - 'true'
Mappings:
  ClusterName:
    sa-east-1:
      dev: ecs-dev
      hml: ECS-CL-HOM-SP
      prod: ECS-CL-PRD-SP
    us-east-2:
      lab: poc
      dev: ecs-dev
      hml: ECS-CL-HOM-OHIO
      prod: ECS-CL-PRD-OHIO
  AspnetEnv:
    dev:
      Name: Development
    hml:
      Name: Homol
    prod:
      Name: Production
  APIDomainName:
    dev:
      Name: apidev.bancofibra.com.br
    hml:
      Name: apiinternalhml.bancofibra.com.br
    prod:
      Name: api.bancofibra.com.br
Resources:
  APITaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      Path: /
      Policies:
      - PolicyName: APIECSTaskExecutionRolePolicy
        PolicyDocument:
          Statement:
          - Effect: Allow
            Action:
            - ecr:GetAuthorizationToken
            - ecr:BatchCheckLayerAvailability
            - ecr:GetDownloadUrlForLayer
            - ecr:BatchGetImage
            - logs:CreateLogStream
            - logs:CreateLogGroup
            - logs:PutLogEvents
            Resource: '*'
          - Effect: Allow
            Action:
            - ssm:GetParameter*
            Resource:
            - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/MatrizAcesso*
      - Fn::If:
        - EnableDatadog
        - PolicyName: DatadogApiKeySecretRead
          PolicyDocument:
            Statement:
            - Effect: Allow
              Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
              Resource:
                Ref: DatadogApiKeySecretName
        - Ref: AWS::NoValue
    Metadata:
      SamResourceId: APITaskExecutionRole
  APITargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name:
        Fn::Join:
        - '-'
        - - tg
          - Ref: APIBasePath
          - api
      HealthCheckIntervalSeconds: 30
      HealthCheckProtocol: TCP
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      TargetType: ip
      Port: 80
      Protocol: TCP
      VpcId:
        Ref: FibraVpc
    Metadata:
      SamResourceId: APITargetGroup
  APILoadBalancerListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
      - TargetGroupArn:
          Ref: APITargetGroup
        Type: forward
      LoadBalancerArn:
        Fn::ImportValue: nlb-api-01
      Port:
        Ref: APIPort
      Protocol: TCP
    Metadata:
      SamResourceId: APILoadBalancerListener
  APITaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: APITaskExecutionRole
    Properties:
      Family:
        Fn::Join:
        - '-'
        - - tsk
          - Ref: ECRAPIRepositoryName
      Cpu:
        Fn::If:
        - IsProd
        - 512
        - 256
      Memory:
        Fn::If:
        - IsProd
        - 1024
        - 512
      NetworkMode: awsvpc
      RequiresCompatibilities:
      - FARGATE
      ExecutionRoleArn:
        Fn::GetAtt:
        - APITaskExecutionRole
        - Arn
      TaskRoleArn:
        Fn::GetAtt:
        - APITaskExecutionRole
        - Arn
      Volumes:
        Fn::If:
        - EnableDatadog
        - - Name: datadog-tracer
        - Ref: AWS::NoValue
      ContainerDefinitions:

      #################################################################
      # DATADOG TRACER INIT (copia o tracer .NET para o volume)
      #################################################################
      - Fn::If:
        - EnableDatadog
        - Name: datadog-tracer-init
          Image:
            Ref: DatadogTracerInitImage
          Essential: false
          Cpu: 0
          User: '0'
          Command:
          - sh
          - copy-lib.sh
          - /datadog
          MountPoints:
          - ContainerPath: /datadog
            SourceVolume: datadog-tracer
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::Join:
                - '-'
                - - ecs/tsk-
                  - Ref: ECRAPIRepositoryName
              awslogs-create-group: true
              awslogs-region:
                Ref: AWS::Region
              awslogs-stream-prefix: tracer-init
        - Ref: AWS::NoValue

      #################################################################
      # FIRELENS LOG ROUTER (Fluent Bit -> Datadog Logs)
      #################################################################
      - Fn::If:
        - EnableDatadog
        - Name: log-router
          Image:
            Ref: DatadogFluentBitImage
          Essential: true
          Cpu: 0
          FirelensConfiguration:
            Type: fluentbit
            Options:
              enable-ecs-log-metadata: 'true'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::Join:
                - '-'
                - - ecs/tsk-
                  - Ref: ECRAPIRepositoryName
              awslogs-create-group: true
              awslogs-region:
                Ref: AWS::Region
              awslogs-stream-prefix: firelens
        - Ref: AWS::NoValue

      #################################################################
      # API
      #################################################################
      - Name:
          Fn::Join:
          - '-'
          - - ctn
            - Ref: ECRAPIRepositoryName
        Essential: true
        DependsOn:
          Fn::If:
          - EnableDatadog
          - - ContainerName: datadog-tracer-init
              Condition: COMPLETE
            - ContainerName: datadog-agent
              Condition: START
            - ContainerName: log-router
              Condition: START
          - Ref: AWS::NoValue
        MountPoints:
          Fn::If:
          - EnableDatadog
          - - ContainerPath: /datadog
              SourceVolume: datadog-tracer
              ReadOnly: true
          - Ref: AWS::NoValue
        Environment:
        - Name: AWS_ACCOUNT_ID
          Value:
            Fn::Sub: ${AWS::AccountId}
        - Name: AWS_REGION
          Value:
            Fn::Sub: ${AWS::Region}
        - Name: ASPNETCORE_ENVIRONMENT
          Value:
            Fn::FindInMap:
            - AspnetEnv
            - Ref: Environment
            - Name
        - Name: IBPJ-REDIS-ENDPOINT
          Value:
            Fn::ImportValue: ibpj-redis-address
        - Fn::If:
          - EnableDatadog
          - Name: CORECLR_ENABLE_PROFILING
            Value: '1'
          - Ref: AWS::NoValue
        - Fn::If:
          - EnableDatadog
          - Name: DD_REMOTE_CONFIGURATION_ENABLED
            Value: 'false'
          - Ref: AWS::NoValue
        - Fn::If:
          - EnableDatadog
          - Name: DD_LOGS_INJECTION
            Value: 'true'
          - Ref: AWS::NoValue
        - Fn::If:
          - EnableDatadog
          - Name: CORECLR_PROFILER
            Value: '{846F5F1C-F9AE-4B07-969E-05C26BC060D8}'
          - Ref: AWS::NoValue
        - Fn::If:
          - EnableDatadog
          - Name: CORECLR_PROFILER_PATH
            Value: /datadog/linux-x64/Datadog.Trace.ClrProfiler.Native.so
          - Ref: AWS::NoValue
        - Fn::If:
          - EnableDatadog
          - Name: DD_DOTNET_TRACER_HOME
            Value: /datadog
          - Ref: AWS::NoValue
        - Fn::If:
          - EnableDatadog
          - Name: DD_TRACE_ENABLED
            Value: 'true'
          - Ref: AWS::NoValue
        - Fn::If:
          - EnableDatadog
          - Name: DD_ENV
            Value:
              Ref: Environment
          - Ref: AWS::NoValue
        - Fn::If:
          - EnableDatadog
          - Name: DD_SERVICE
            Value:
              Ref: APIName
          - Ref: AWS::NoValue
        - Fn::If:
          - EnableDatadog
          - Name: DD_VERSION
            Value:
              Ref: ECRAPIImageVersion
          - Ref: AWS::NoValue
        Image:
          Fn::Join:
          - ''
          - - Ref: AWS::AccountId
            - .dkr.ecr.
            - Ref: AWS::Region
            - .
            - Ref: AWS::URLSuffix
            - /
            - Ref: ECRAPIRepositoryName
            - ':'
            - Ref: ECRAPIImageVersion
        PortMappings:
        - ContainerPort: 80
        LogConfiguration:
          Fn::If:
          - EnableDatadog
          - LogDriver: awsfirelens
            Options:
              Name: datadog
              Host:
                Fn::Sub: http-intake.logs.${DatadogSite}
              TLS: 'on'
              provider: ecs
              compress: gzip
              dd_service:
                Ref: APIName
              dd_source: csharp
              dd_tags:
                Fn::Sub: env:${Environment},version:${ECRAPIImageVersion}
              dd_message_key: log
            SecretOptions:
            - Name: apikey
              ValueFrom:
                Ref: DatadogApiKeySecretName
          - LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::Join:
                - '-'
                - - ecs/tsk-
                  - Ref: ECRAPIRepositoryName
              awslogs-create-group: true
              awslogs-region:
                Ref: AWS::Region
              awslogs-stream-prefix: api

      #################################################################
      # DATADOG AGENT (metricas + APM)
      #################################################################
      - Fn::If:
        - EnableDatadog
        - Name: datadog-agent
          Image:
            Ref: DatadogAgentImage
          Essential: false
          Cpu: 0
          Environment:
          - Name: DD_SITE
            Value:
              Ref: DatadogSite
          - Name: ECS_FARGATE
            Value: 'true'
          - Name: DD_APM_ENABLED
            Value: 'true'
          - Name: DD_APM_NON_LOCAL_TRAFFIC
            Value: 'false'
          - Name: DD_LOGS_ENABLED
            Value: 'false'
          - Name: DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED
            Value: 'false'
          - Name: DD_ENV
            Value:
              Ref: Environment
          Secrets:
          - Name: DD_API_KEY
            ValueFrom:
              Ref: DatadogApiKeySecretName
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::Join:
                - '-'
                - - ecs/tsk-
                  - Ref: ECRAPIRepositoryName
              awslogs-create-group: true
              awslogs-region:
                Ref: AWS::Region
              awslogs-stream-prefix: datadog
        - Ref: AWS::NoValue
    Metadata:
      SamResourceId: APITaskDefinition
  APIContainerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Access to the Fargate containers
      VpcId:
        Ref: FibraVpc
      SecurityGroupIngress:
      - CidrIp: '0.0.0.0/0'
        IpProtocol: tcp
        FromPort: 80
        ToPort: 80
    Metadata:
      SamResourceId: APIContainerSecurityGroup
  APIService:
    Type: AWS::ECS::Service
    DependsOn: APILoadBalancerListener
    Properties:
      ServiceName:
        Fn::Join:
        - '-'
        - - svc
          - Ref: APIBasePath
          - api
      Cluster:
        Fn::Join:
        - ''
        - - 'arn:aws:ecs:'
          - Ref: AWS::Region
          - ':'
          - Ref: AWS::AccountId
          - :cluster/
          - Fn::FindInMap:
            - ClusterName
            - Ref: AWS::Region
            - Ref: Environment
      LaunchType: FARGATE
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      DesiredCount:
        Fn::If:
        - IsProd
        - 2
        - 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
          - Ref: APIContainerSecurityGroup
          Subnets:
            Ref: Subnets
      TaskDefinition:
        Ref: APITaskDefinition
      LoadBalancers:
      - ContainerName:
          Fn::Join:
          - '-'
          - - ctn
            - Ref: ECRAPIRepositoryName
        ContainerPort: 80
        TargetGroupArn:
          Ref: APITargetGroup
    Metadata:
      SamResourceId: APIService
  API:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name:
        Ref: APIName
      EndpointConfiguration:
        Types:
        - REGIONAL
    Metadata:
      SamResourceId: API
  APIProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: API
      PathPart: '{proxy+}'
      ParentId:
        Fn::GetAtt:
        - API
        - RootResourceId
    Metadata:
      SamResourceId: APIProxyResource
  APIProxyAnyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: API
      ResourceId:
        Ref: APIProxyResource
      AuthorizationType: NONE
      ApiKeyRequired: true
      HttpMethod: ANY
      RequestParameters:
        method.request.path.proxy: true
      Integration:
        ConnectionType: VPC_LINK
        ConnectionId:
          Fn::ImportValue: vpclink-api-01
        IntegrationHttpMethod: ANY
        Type: HTTP_PROXY
        RequestParameters:
          integration.request.path.proxy: method.request.path.proxy
        Uri:
          Fn::Join:
          - ''
          - - http://
            - Fn::FindInMap:
              - APIDomainName
              - Ref: Environment
              - Name
            - ':'
            - Ref: APIPort
            - /{proxy}
    Metadata:
      SamResourceId: APIProxyAnyMethod
  APIProxyOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: API
      ResourceId:
        Ref: APIProxyResource
      AuthorizationType: NONE
      ApiKeyRequired: false
      HttpMethod: OPTIONS
      RequestParameters:
        method.request.path.proxy: true
      Integration:
        Type: MOCK
        IntegrationResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
            method.response.header.Access-Control-Allow-Methods: '''DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'''
            method.response.header.Access-Control-Allow-Origin: '''*'''
          ResponseTemplates:
            application/json: ''
        PassthroughBehavior: WHEN_NO_MATCH
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
      - StatusCode: 200
        ResponseModels:
          application/json: Empty
        ResponseParameters:
          method.response.header.Access-Control-Allow-Headers: false
          method.response.header.Access-Control-Allow-Methods: false
          method.response.header.Access-Control-Allow-Origin: false
    Metadata:
      SamResourceId: APIProxyOptionsMethod
  APIDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
    - APIProxyAnyMethod
    - APIProxyOptionsMethod
    Properties:
      RestApiId:
        Ref: API
      Description:
        Fn::Sub: 'Data de publicacao: ${DeployDate}'
      StageName:
        Fn::Join:
        - '-'
        - - Ref: APIName
          - Ref: Environment
      StageDescription:
        LoggingLevel: INFO
        DataTraceEnabled: true
        TracingEnabled: true
    Metadata:
      SamResourceId: APIDeployment
  APIBasePathDomainName:
    Type: AWS::ApiGateway::BasePathMapping
    DependsOn:
    - APIDeployment
    Condition: NotLab
    Properties:
      RestApiId:
        Ref: API
      BasePath:
        Ref: APIBasePath
      DomainName:
        Fn::FindInMap:
        - APIDomainName
        - Ref: Environment
        - Name
      Stage:
        Fn::Join:
        - '-'
        - - Ref: APIName
          - Ref: Environment
    Metadata:
      SamResourceId: APIBasePathDomainName
